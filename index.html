<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Control de Boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F0; --paper:#FFFFFF; --ink:#2B2233; --ink-2:#5E5566; --ink-3:#8E8797;
  --line:#E4E0DA; --line-2:#CFC9C0;
  --plum:#4A2E5C; --plum-2:#6A4A80; --plum-soft:#EFE9F4;
  --gold:#B8923F; --gold-soft:#F5EEDD;
  --sage:#5F8A6B; --sage-soft:#E4EFE6;
  --coral:#C4473F; --coral-soft:#F8E3E1;
  --amber:#C98A1F; --amber-soft:#FBF0DB;
  --edit:#FBF6E9; --shadow:0 1px 2px rgba(43,34,51,.06), 0 8px 24px -12px rgba(43,34,51,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1620; --paper:#241D2B; --ink:#EEE8F2; --ink-2:#BDB3C6; --ink-3:#8C8296;
    --line:#352C3E; --line-2:#4A3F55;
    --plum:#C9AEDD; --plum-2:#A98BC0; --plum-soft:#31263B;
    --gold:#D6B266; --gold-soft:#3A3021;
    --sage:#8DBE9A; --sage-soft:#24352A;
    --coral:#E57C74; --coral-soft:#3E2626;
    --amber:#E3A63A; --amber-soft:#3B2F1B;
    --edit:#2E2636; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1620; --paper:#241D2B; --ink:#EEE8F2; --ink-2:#BDB3C6; --ink-3:#8C8296;
  --line:#352C3E; --line-2:#4A3F55;
  --plum:#C9AEDD; --plum-2:#A98BC0; --plum-soft:#31263B;
  --gold:#D6B266; --gold-soft:#3A3021;
  --sage:#8DBE9A; --sage-soft:#24352A;
  --coral:#E57C74; --coral-soft:#3E2626;
  --amber:#E3A63A; --amber-soft:#3B2F1B;
  --edit:#2E2636; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:34px;line-height:1.1}
h2{font-size:26px;line-height:1.15}
h3{font-size:19px;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--paper);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px}
.brand .name{font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1.1}
.brand .sub{color:var(--ink-3);font-size:12px;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--plum-soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--plum);color:#fff}
:root[data-theme="dark"] .nav button[aria-current="page"],
:root:not([data-theme="light"]) .nav button[aria-current="page"]{color:#1B1620}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .nav button[aria-current="page"]{color:#fff}}
.nav .badge{margin-left:auto;font-size:11px;background:var(--coral);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{padding:26px 34px 60px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar .meta{color:var(--ink-3);font-size:13px;margin-top:6px}
.countdown{display:flex;align-items:baseline;gap:8px}
.countdown .n{font-family:"Cormorant Garamond",serif;font-size:44px;line-height:1;color:var(--plum)}
.countdown .l{color:var(--ink-2)}

/* Buttons */
.btn{border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--plum-2)}
.btn.primary{background:var(--plum);border-color:var(--plum);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1B1620}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1B1620}}
.btn.small{padding:5px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--coral)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.g4,.g3,.g2{grid-template-columns:1fr}}
.kpi .label{color:var(--ink-2);font-size:13px}
.kpi .value{font-family:"Cormorant Garamond",serif;font-size:32px;line-height:1.1;margin-top:6px}
.kpi .hint{color:var(--ink-3);font-size:12px;margin-top:4px}
.kpi.alert .value{color:var(--coral)}
.kpi.ok .value{color:var(--sage)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-title p{color:var(--ink-3);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--plum);border-radius:99px}
.bar > i.gold{background:var(--gold)}
.bar > i.coral{background:var(--coral)}

/* Alerts list */
.alerts{display:flex;flex-direction:column}
.alerts .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.alerts .row:last-child{border-bottom:0}
.alerts .row .n{font-family:"Cormorant Garamond",serif;font-size:22px;min-width:38px;text-align:right}
.alerts .row.hot .n{color:var(--coral)}
.alerts .row button{border:0;background:transparent;text-align:left;color:var(--ink);padding:0}
.alerts .row button:hover{color:var(--plum);text-decoration:underline}

/* Tables */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .spacer{flex:1}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:7px 10px;min-width:140px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table.data{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
table.data th{position:sticky;top:0;background:var(--paper);text-align:left;font-weight:600;color:var(--ink-2);padding:10px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;font-size:12px;z-index:1}
table.data td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.data tr:last-child td{border-bottom:0}
table.data tr.excluded td{opacity:.5}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
table.data td.calc{color:var(--ink-2);font-variant-numeric:tabular-nums}
table.data td.calc.num{text-align:right}
table.data input,table.data select{width:100%;border:1px solid transparent;background:var(--edit);border-radius:6px;padding:5px 7px;min-width:70px}
table.data input:hover,table.data select:hover{border-color:var(--line-2)}
table.data input:focus,table.data select:focus{border-color:var(--gold);outline:none;background:var(--paper)}
table.data input[type=number]{text-align:right;min-width:100px}
table.data input[type=date]{min-width:140px}
table.data input[type=time]{min-width:120px}
table.data input[type=text]{min-width:130px}
table.data input.narrow{min-width:64px}
table.data input.wide{min-width:190px}
table.data input.xwide{min-width:260px}
table.data input[type=checkbox]{width:16px;height:16px;min-width:0;accent-color:var(--plum);margin:0 6px}
table.data td.id{color:var(--ink-3);font-size:12px;text-align:right;padding-right:10px;min-width:40px}
table.data .del{border:0;background:transparent;color:var(--ink-3);padding:2px 6px;border-radius:6px}
table.data .del:hover{color:var(--coral);background:var(--coral-soft)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--sage-soft);color:var(--sage)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--coral-soft);color:var(--coral)}
.pill.mute{background:var(--line);color:var(--ink-2)}
.pill.plum{background:var(--plum-soft);color:var(--plum)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}

/* Forms */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
.form input,.form select{border:1px solid var(--line-2);background:var(--edit);border-radius:8px;padding:8px 10px;color:var(--ink)}
.form input:focus{border-color:var(--gold);outline:none;background:var(--paper)}
@media (max-width:700px){.form{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--plum-soft);color:var(--plum);border-radius:99px;padding:4px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.chip button{border:0;background:transparent;padding:0;color:inherit;opacity:.7;line-height:1}
.chip button:hover{opacity:1}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add input{flex:1;border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;background:var(--edit)}

/* Charts */
.catlist{display:flex;flex-direction:column;gap:10px}
.catlist .r{display:grid;grid-template-columns:170px 1fr 100px 90px;gap:12px;align-items:center;font-size:13px}
.catlist .r .amt{text-align:right;font-variant-numeric:tabular-nums}
.catlist .r .pct{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.catlist .bar{position:relative}
.catlist .bar .paid{position:absolute;left:0;top:0;height:100%;background:var(--sage)}
@media (max-width:700px){.catlist .r{grid-template-columns:110px 1fr 80px}.catlist .r .pct{display:none}}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:"Manrope",sans-serif;font-size:11px;fill:var(--ink-3)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Floor plan */
.floor{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media (max-width:1000px){.floor{grid-template-columns:1fr}}
.plan{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:auto;max-height:80vh}
.plan svg{display:block;max-width:none;margin:0 auto;user-select:none;-webkit-user-select:none}
.plan .gl{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.55}
.plan .gl.m5{stroke:var(--line-2);opacity:.9}
.plan .salon{fill:none;stroke:var(--ink-2);stroke-width:2;vector-effect:non-scaling-stroke}
.plan .dim{fill:var(--ink-3);text-anchor:middle;font-family:"Manrope",sans-serif}
.plan .escala line{stroke:var(--ink-2);stroke-width:2;vector-effect:non-scaling-stroke}
.plan .escala text{fill:var(--ink-2);font-family:"Manrope",sans-serif}
.plan .item{cursor:grab;touch-action:none;outline:none}
.plan .item.drag{cursor:grabbing;opacity:.85}
.plan .item .shape{fill:var(--paper);stroke:var(--line-2);stroke-width:1.5;vector-effect:non-scaling-stroke}
.plan .item:hover .shape,.plan .item.sel .shape{stroke:var(--plum);stroke-width:2.5}
.plan .item:focus-visible .shape{stroke:var(--gold);stroke-width:3}
.plan .item.bad .shape{stroke:var(--coral);stroke-width:2.5;stroke-dasharray:6 4}
.plan .elem .shape{fill:var(--gold-soft);stroke:var(--gold)}
.plan .tbl.honor .shape{fill:var(--plum-soft);stroke:var(--plum-2)}
.plan .tbl.over .shape{stroke:var(--coral);stroke-width:2.5;fill:var(--coral-soft)}
.plan .tbl.drop .shape{stroke:var(--gold);stroke-width:3;fill:var(--gold-soft)}
.plan .item .nm{font-family:"Cormorant Garamond",serif;font-weight:600;fill:var(--ink);text-anchor:middle;pointer-events:none}
.plan .item .ct{font-family:"Manrope",sans-serif;fill:var(--ink-3);text-anchor:middle;pointer-events:none}
.plan .seat{fill:var(--line);stroke:var(--line-2);stroke-width:1;vector-effect:non-scaling-stroke}
.plan .seat.on{fill:var(--plum);stroke:none}
.plan .seat.extra{fill:var(--coral);stroke:none}
.plan .huella{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
.plan-tools{align-items:center}
.plan-tools label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.plan-tools input[type=number]{width:70px;border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:6px 8px;color:var(--ink)}
.plan-tools select{min-width:120px}
.rotbtns{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.plan .item.fijo .shape{fill:url(#hatch);stroke:var(--ink-2)}
.plan .item.puerta .shape{fill:var(--plum-soft);stroke:var(--plum-2);stroke-width:2.5}
.plan .item.salida .shape{fill:var(--coral-soft);stroke:var(--coral);stroke-width:2.5}
.plan .item.zona .shape{fill:var(--gold-soft);fill-opacity:.5;stroke-dasharray:10 6;pointer-events:visibleStroke}
.plan .despeje{fill:none;stroke:var(--coral);stroke-width:2;stroke-dasharray:8 6;opacity:.55;pointer-events:none}
table.simple{width:100%;border-collapse:collapse;font-size:13px}table.simple th{text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-2)}table.simple td{padding:8px 10px;border-bottom:1px solid var(--line)}table.simple td.num{text-align:right;font-variant-numeric:tabular-nums}table.simple td.mut{color:var(--ink-2);font-size:12px}
.ckrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);margin-top:8px}
.ckrow.llego{opacity:.65;background:var(--gold-soft)}.ckn{display:flex;flex-direction:column;gap:2px}.ckn .s,.ckm .s{font-size:12px;color:var(--ink-2)}.ckm{display:flex;flex-direction:column;align-items:flex-end}.ckm .big{font-size:20px;font-weight:600}
@media(max-width:640px){.ckrow{grid-template-columns:1fr auto}.ckrow button{grid-column:1/-1}}
.gantt{min-width:640px;font-size:12px}.gh,.glane{display:flex}.gl0{width:120px;flex:none;padding:6px 8px 6px 0;color:var(--ink-2);font-weight:600}.gtrack{position:relative;flex:1;border-left:1px solid var(--line)}.gtrack.hh{height:22px}.gtrack.hh span{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--ink-2)}
.glane{border-top:1px solid var(--line)}.gbar{position:absolute;height:24px;line-height:24px;padding:0 6px;border-radius:6px;background:var(--plum);color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px}.gbar.done{opacity:.5}.gbar.choque{background:var(--gold);color:#2B2233}
.medidas-panel{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}
.medidas-panel .help{width:100%;margin:0}
.medida{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.medida input{width:72px;padding:6px 8px}
.medida input[type=checkbox]{width:auto;padding:0}
.plan .item.carpa .shape{fill:#fff;fill-opacity:.55;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:none}
.plan .item.zona .nm{pointer-events:auto;fill:var(--ink-2)}
.plan .silla{fill:var(--line-2)}
.plan .ini{fill:#fff;font-family:"Manrope",sans-serif;font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.plan .med line{stroke:var(--coral);stroke-width:2.5;vector-effect:non-scaling-stroke}
.plan .med circle{fill:var(--coral)}
.plan .med text{fill:var(--coral);font-family:"Manrope",sans-serif;font-weight:700;text-anchor:middle}
.plan.midiendo svg{cursor:crosshair}
.plan.midiendo .item{cursor:crosshair}
.plan .marq{fill:var(--plum);fill-opacity:.12;stroke:var(--plum);stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}
.plan .vert{fill:var(--gold);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;cursor:move}
.plan .mid{fill:var(--plum-soft);stroke:var(--plum-2);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:copy}
.plan svg.forma .item{pointer-events:none}
.plan.panning,.plan.panning *{cursor:grabbing!important}
.plan-tools input[type=range]{width:110px}
.plan-tools .help{margin:0}
.plan-tools input[type=checkbox]{width:auto}
.fondo-tools{background:var(--plum-soft);border-radius:var(--r);padding:8px 12px}
.side-panel{display:flex;flex-direction:column;gap:12px}
.guestlist{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow:auto}
.guest{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;background:var(--bg);font-size:13px;cursor:grab}
.guest:active{cursor:grabbing}
.guest .s{color:var(--ink-3);font-size:12px}
.guest button{border:0;background:transparent;color:var(--ink-3);padding:0 4px}
.guest button:hover{color:var(--coral)}
.guest.dup{outline:1px solid var(--coral)}

/* Timeline (día del evento) */
.timeline{display:flex;flex-direction:column}
.timeline .t{display:grid;grid-template-columns:110px 18px 1fr;gap:12px;padding:8px 0}
.timeline .t .h{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;font-size:13px;padding-top:2px}
.timeline .t .dot{position:relative}
.timeline .t .dot::before{content:"";position:absolute;left:8px;top:0;bottom:-16px;width:1px;background:var(--line-2)}
.timeline .t:last-child .dot::before{display:none}
.timeline .t .dot::after{content:"";position:absolute;left:4px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--plum);border:2px solid var(--paper)}
.timeline .t.done .dot::after{background:var(--sage)}
.timeline .t.gap .dot::after{background:var(--coral)}
.timeline .t .body{display:flex;flex-direction:column;gap:2px}
.timeline .t .body .a{font-weight:600}
.timeline .t .body .m{color:var(--ink-3);font-size:12px}

/* Toast / modal */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(20,12,28,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--paper);border-radius:14px;padding:22px;max-width:480px;width:100%;box-shadow:var(--shadow)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.help{color:var(--ink-3);font-size:12.5px;margin-top:8px}
.legendkey{display:flex;gap:14px;font-size:12px;color:var(--ink-3);align-items:center}
.legendkey i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-3px;border:1px solid var(--line-2)}
.legendkey i.e{background:var(--edit)}
.legendkey i.a{background:var(--paper)}

/* Mobile */
.menu-btn{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}

<script>
/* ==================================================================
   ESTADO Y PERSISTENCIA
   ================================================================== */
const STORE_KEY = 'ccb.v1';
const MENUS_BASE=['Estándar','Vegetariano','Vegano','Infantil','Otro'];
const LISTAS = {
  estadoGasto:['Por cotizar','Cotizado','En negociación','Contratado','Liquidado','Cancelado'],
  tipoCosto:['Fijo','Por invitado','Por unidad'],
  estadoPago:['Pendiente','Pagado','Reprogramado','Cancelado'],
  estadoTarea:['No iniciada','En curso','Bloqueada','Completada','Omitida'],
  prioridad:['Alta','Media','Baja'],
  rsvp:['Pendiente','Confirmado','Declinado'],
  edad:['Adulto','Adolescente','Niño','Bebé'],
  siNo:['Sí','No'],
  get menu(){const m=(typeof S!=='undefined'&&S&&S.config&&Array.isArray(S.config.menus)&&S.config.menus.length)?S.config.menus:MENUS_BASE;return ['Sin definir',...m.filter(x=>x!=='Sin definir')]},
  estadoProveedor:['Por investigar','Contactado','Cotizado','En negociación','Contratado','Descartado'],
  estadoDecision:['Pendiente','Investigando','Decidida','Descartada'],
  tipoMesa:['Redonda','Cuadrada','Rectangular','Imperial','Mesa de honor','Ovalada','Otra'],
  metodo:['Transferencia','Efectivo','Tarjeta','Depósito','Otro'],
};
const CATEGORIAS_BASE = ['Planeación','Ceremonia','Lugar y banquete','Bebidas','Fotografía y video','Música y entretenimiento','Decoración y flores','Vestimenta','Belleza','Papelería y señalética','Anillos y joyería','Transporte','Hospedaje','Souvenirs y regalos','Pastel y postres','Producción y montaje','Trámites y civil','Tecnología','Seguridad y personal','Luna de miel','Extras'];

function pad(n,w=3){return String(n).padStart(w,'0')}
function nextId(list,prefix){let m=0;for(const r of list){const n=parseInt((r.id||'').replace(prefix,''),10);if(!isNaN(n)&&n>m)m=n}return prefix+pad(m+1)}
function iso(d){return d.toISOString().slice(0,10)}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)}
function today(){return iso(new Date())}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function fmtDate(s){if(!s)return '';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDateShort(s){if(!s)return '';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let moneyFmt;
function money(n){if(!moneyFmt||moneyFmt._c!==S.config.moneda){try{moneyFmt=new Intl.NumberFormat('es-MX',{style:'currency',currency:S.config.moneda||'MXN',maximumFractionDigits:0})}catch(e){moneyFmt=new Intl.NumberFormat('es-MX',{maximumFractionDigits:0})}moneyFmt._c=S.config.moneda}return moneyFmt.format(num(n))}

/* ==================================================================
   MEDIDAS REALES DEL SALÓN (todo en metros)
   ================================================================== */
// Elementos sin asientos que se pueden colocar en el plano: [largo, ancho] en metros
const PRESETS_ELEM = {'Pista de baile':[6,6],'Barra':[4,0.8],'Escenario':[6,3],'Cabina DJ':[2,1],'Buffet':[4,1],'Mesa de pastel':[1,1],'Mesa de regalos':[2,0.8],'Recepción / registro':[2,1],'Photobooth':[2,2],'Lounge':[4,3],'Área de niños':[4,3],'Guardarropa':[2,1],'Baños':[3,2],'Cocina / servicio':[4,3],'Ceremonia (filas)':[6.2,7.2],'Columna':[0.5,0.5],'Escalera':[2,3],'Puerta / entrada':[1.8,1.2],'Salida de emergencia':[1.8,1.2],'Zona no utilizable':[3,3],'Zona / área':[8,6],'Carpa':[10,6],'Otro':[2,2]};
const TIPOS_FIJOS = new Set(['Columna','Escalera','Puerta / entrada','Salida de emergencia','Zona no utilizable']);
const TIPOS_PUERTA = new Set(['Puerta / entrada','Salida de emergencia']);
const TIPO_ZONA = 'Zona / área', TIPO_CARPA = 'Carpa';
const esZona = t=>t===TIPO_ZONA||t===TIPO_CARPA;
const r1 = v=>Math.round(v*10)/10;
function esRedonda(t){return t==='Redonda'||t==='Otra'}
function sinUbicar(it){return it.x===null||it.x===undefined||it.x===''||it.y===null||it.y===undefined||it.y===''}

// Medidas sugeridas (sin contar las sillas) según tipo y capacidad
function medidasPorDefecto(tipo,cap){
  cap=Math.max(1,Math.round(num(cap))||1);
  if(esRedonda(tipo)){const d=Math.max(1,Math.ceil((cap*0.6/Math.PI-0.05)*10)/10);return{largo:d,ancho:d}}
  if(tipo==='Cuadrada'){const s=cap<=4?0.9:cap<=6?1.2:1.5;return{largo:s,ancho:s}}
  if(tipo==='Mesa de honor')return{largo:r1(Math.max(2.4,cap*0.65+0.3)),ancho:0.9};
  if(tipo==='Ovalada'){const l=r1(Math.max(2,Math.ceil(cap/2)*0.65+0.3));return{largo:l,ancho:r1(Math.max(1.2,Math.min(l*0.6,1.5)))}}
  const cabeceras=(tipo==='Rectangular'&&cap>=6)?2:0;
  const porLado=Math.ceil((cap-cabeceras)/2);
  return{largo:r1(Math.max(tipo==='Imperial'?2.4:1.5,porLado*0.65+0.3)),ancho:tipo==='Imperial'?1.0:0.9};
}

// Huella de un elemento: la mesa con sus sillas (0.5 m alrededor) más el margen de pasillo "infl".
// t:'c' círculo {cx,cy,r}  ·  t:'o' rectángulo girado {cx,cy,hw,hh,a}
function huella(it,infl){
  const a=(num(it.rot)||0)*Math.PI/180, w=num(it.largo)||1, h=num(it.ancho)||w, cx=num(it.x), cy=num(it.y);
  if(it.capacidad===undefined)return{t:'o',cx,cy,hw:w/2+infl,hh:h/2+infl,a};           // elemento sin sillas
  if(esRedonda(it.tipo))return{t:'c',cx,cy,r:w/2+0.5+infl};
  if(it.tipo==='Mesa de honor'){const off=0.25;                                       // sillas solo de un lado
    return{t:'o',cx:cx-Math.sin(a)*off,cy:cy+Math.cos(a)*off,hw:w/2+infl,hh:h/2+off+infl,a}}
  return{t:'o',cx,cy,hw:w/2+0.5+infl,hh:h/2+0.5+infl,a};
}
function esquinas(o){const c=Math.cos(o.a),s=Math.sin(o.a);return[[-o.hw,-o.hh],[o.hw,-o.hh],[o.hw,o.hh],[-o.hw,o.hh]].map(([x,y])=>[o.cx+x*c-y*s,o.cy+x*s+y*c])}
function obbObb(a,b){
  const ejes=[];for(const o of[a,b]){const c=Math.cos(o.a),s=Math.sin(o.a);ejes.push([c,s],[-s,c])}
  const ca=esquinas(a),cb=esquinas(b);
  for(const[ax,ay]of ejes){
    const pa=ca.map(p=>p[0]*ax+p[1]*ay),pb=cb.map(p=>p[0]*ax+p[1]*ay);
    if(Math.max(...pa)<=Math.min(...pb)+1e-9||Math.max(...pb)<=Math.min(...pa)+1e-9)return false;
  }
  return true;
}
function circObb(c,o){
  const cs=Math.cos(-o.a),sn=Math.sin(-o.a),dx=c.cx-o.cx,dy=c.cy-o.cy;
  const lx=dx*cs-dy*sn,ly=dx*sn+dy*cs;
  const qx=Math.max(-o.hw,Math.min(o.hw,lx)),qy=Math.max(-o.hh,Math.min(o.hh,ly));
  return Math.hypot(lx-qx,ly-qy)<c.r-1e-9;
}
function solapaF(a,b){
  if(a.t==='c'&&b.t==='c')return Math.hypot(a.cx-b.cx,a.cy-b.cy)<a.r+b.r-1e-9;
  if(a.t==='c')return circObb(a,b);
  if(b.t==='c')return circObb(b,a);
  return obbObb(a,b);
}
function solapan(a,b,infl){return solapaF(huella(a,infl),huella(b,infl))}
function polySalon(c){return Array.isArray(c.forma)&&c.forma.length>=3?c.forma:null}
function enPoligono(px,py,poly){let d=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)d=!d}return d}
function puntoEnHuella(x,y,h){
  if(h.t==='c')return Math.hypot(x-h.cx,y-h.cy)<h.r;
  const cs=Math.cos(-h.a),sn=Math.sin(-h.a),dx=x-h.cx,dy=y-h.cy,lx=dx*cs-dy*sn,ly=dx*sn+dy*cs;
  return Math.abs(lx)<h.hw&&Math.abs(ly)<h.hh;
}
function puntosBorde(h){
  const out=[];
  if(h.t==='c'){for(let i=0;i<32;i++){const a=i*2*Math.PI/32;out.push([h.cx+Math.cos(a)*h.r,h.cy+Math.sin(a)*h.r])}return out}
  const cs=esquinas(h);
  for(let i=0;i<4;i++){const[x0,y0]=cs[i],[x1,y1]=cs[(i+1)%4],n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/0.25));for(let k=0;k<n;k++)out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n])}
  return out;
}
function areaSalon(c){
  const p=polySalon(c);if(!p)return(num(c.salonL)||30)*(num(c.salonA)||20);
  let a=0;for(let i=0;i<p.length;i++){const[x0,y0]=p[i],[x1,y1]=p[(i+1)%p.length];a+=x0*y1-x1*y0}return Math.abs(a)/2;
}
function fueraDelSalon(it,L,A,margen=0,poly=null){
  const m=margen;
  if(poly){
    const h=huella(it,m-0.002);
    if(puntosBorde(h).some(([x,y])=>!enPoligono(x,y,poly)))return true;
    return poly.some(([x,y])=>puntoEnHuella(x,y,h));
  }
  const h=huella(it,0);
  if(h.t==='c')return h.cx-h.r<m-1e-9||h.cy-h.r<m-1e-9||h.cx+h.r>L-m+1e-9||h.cy+h.r>A-m+1e-9;
  return esquinas(h).some(([x,y])=>x<m-1e-9||y<m-1e-9||x>L-m+1e-9||y>A-m+1e-9);
}

// Posición de cada silla en coordenadas locales de la mesa (metros, mesa centrada en 0,0 sin girar)
function asientosLocal(m,n){
  const w=num(m.largo)||1,h=num(m.ancho)||w,off=0.3,out=[];
  if(m.tipo==='Ovalada'){const a=w/2,b=h/2;for(let i=0;i<n;i++){const t=-Math.PI/2+i*2*Math.PI/n,nx=Math.cos(t)/a,ny=Math.sin(t)/b,nn=Math.hypot(nx,ny);out.push({x:a*Math.cos(t)+off*nx/nn,y:b*Math.sin(t)+off*ny/nn})}return out}
  if(esRedonda(m.tipo)){const R=w/2+off;for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;out.push({x:Math.cos(a)*R,y:Math.sin(a)*R})}return out}
  const lado=(k,y)=>{for(let i=0;i<k;i++)out.push({x:-w/2+(i+0.5)*w/k,y})};
  if(m.tipo==='Mesa de honor'){lado(n,h/2+off);return out}                       // todos de un lado, de frente al salón
  if(m.tipo==='Cuadrada'){
    const per=[0,0,0,0];for(let i=0;i<n;i++)per[i%4]++;
    lado(per[0],-h/2-off);lado(per[2],h/2+off);
    for(let i=0;i<per[1];i++)out.push({x:w/2+off,y:-h/2+(i+0.5)*h/per[1]});
    for(let i=0;i<per[3];i++)out.push({x:-w/2-off,y:-h/2+(i+0.5)*h/per[3]});
    return out;
  }
  const cab=(m.tipo==='Rectangular'&&n>=6)?2:0,resto=n-cab,sup=Math.ceil(resto/2);  // Imperial: solo lados largos
  lado(sup,-h/2-off);lado(resto-sup,h/2+off);
  if(cab)out.push({x:-w/2-off,y:0},{x:w/2+off,y:0});
  return out;
}
// Asigna a cada invitado su silla según el número de asiento capturado
function ocupacion(n,lista){
  const occ=Array(n).fill(null),resto=[];
  for(const g of lista){const k=parseInt(g.asiento,10);if(k>=1&&k<=n&&!occ[k-1])occ[k-1]=g;else resto.push(g)}
  for(const g of resto){const j=occ.indexOf(null);if(j>=0)occ[j]=g}
  return occ;
}

// Acomodo automático: primer lugar libre (de arriba a la izquierda) respetando pasillo y límites del salón
function itemsUbicados(st){return[...st.mesas.filter(m=>!sinUbicar(m)),...(st.elementos||[]).filter(e=>!sinUbicar(e))]}
function colocarItem(st,it,ox,oy){
  const c=st.config,L=num(c.salonL)||30,A=num(c.salonA)||20,infl=(num(c.pasillo)||0.8)/2+0.25;
  const otros=itemsUbicados(st).filter(o=>o!==it&&!esZona(o.tipo));
  const pts=[];for(let y=0;y<=A;y+=0.5)for(let x=0;x<=L;x+=0.5)pts.push([x,y]);
  if(ox!=null&&oy!=null)pts.sort((a,b)=>Math.hypot(a[0]-ox,a[1]-oy)-Math.hypot(b[0]-ox,b[1]-oy));
  for(const [x,y] of pts){
    it.x=x;it.y=y;
    if(!TIPOS_PUERTA.has(it.tipo)&&fueraDelSalon(it,L,A,0.3,polySalon(c)))continue;
    if(!esZona(it.tipo)&&otros.some(o=>solapan(it,o,infl)))continue;
    return true;
  }
  it.x=null;it.y=null;return false;
}
function colocarPendientes(st){
  st.elementos=st.elementos||[];
  for(const e of st.elementos)if(sinUbicar(e))colocarItem(st,e);
  for(const m of st.mesas)if(sinUbicar(m))colocarItem(st,m);
}

// Revisión del plano: encimados (menos pasillo mínimo), fuera del salón y sin ubicar
function conflictosPlano(st){
  const c=st.config,L=num(c.salonL)||30,A=num(c.salonA)||20,infl=(num(c.pasillo)||0.8)/2;
  const todos=[...st.mesas.map(m=>({k:'mesas:'+m.id,it:m})),...(st.elementos||[]).map(e=>({k:'elementos:'+e.id,it:e}))];
  const ub=todos.filter(x=>!sinUbicar(x.it)&&!esZona(x.it.tipo));
  const enc=new Set(),fuera=new Set(),sin=new Set(todos.filter(x=>sinUbicar(x.it)).map(x=>x.k));
  const hu=ub.map(x=>huella(x.it,infl));
  for(let i=0;i<ub.length;i++){
    if(!TIPOS_PUERTA.has(ub[i].it.tipo)&&fueraDelSalon(ub[i].it,L,A,0,polySalon(c)))fuera.add(ub[i].k);
    for(let j=i+1;j<ub.length;j++)if(solapaF(hu[i],hu[j])){enc.add(ub[i].k);enc.add(ub[j].k)}
  }
  return{enc,fuera,sin,total:new Set([...enc,...fuera,...sin]).size};
}
function estadoPlano(it,kind,cf){
  const k=kind+':'+it.id;
  return cf.sin.has(k)?'Sin ubicar':cf.fuera.has(k)?'Fuera del salón':cf.enc.has(k)?(kind==='mesas'?'Encimada':'Encimado'):'OK';
}
function areaOcupada(st){
  let a=0;
  for(const m of st.mesas){if(sinUbicar(m))continue;const h=huella(m,0);a+=h.t==='c'?Math.PI*h.r*h.r:4*h.hw*h.hh}
  for(const e of(st.elementos||[])){if(sinUbicar(e)||esZona(e.tipo))continue;a+=(num(e.largo)||0)*(num(e.ancho)||0)}
  return a;
}

// Completa los datos guardados antes de existir las medidas reales
function migrar(d){
  const c=d.config;
  if(!Array.isArray(c.menus)||!c.menus.length)c.menus=[...MENUS_BASE];
  if(c.salonL==null)c.salonL=30; if(c.salonA==null)c.salonA=20; if(c.pasillo==null)c.pasillo=0.8;
  d.elementos=d.elementos||[]; if(d.fondo===undefined)d.fondo=null;
  d.restricciones=d.restricciones||[];
  d.rsvp=d.rsvp||{lista:[],ultima:'',sitio:'',tel:{},rec:{}};
  d.cotizaciones=d.cotizaciones||[];d.liturgia=d.liturgia||[];d.participantes=d.participantes||[];
  if(!d.ceremonia)d.ceremonia=nuevaCeremonia();if(!d.insumos)d.insumos=nuevosInsumos();
  if(!d.layouts||!d.layouts.lista||!d.layouts.lista.length)d.layouts={activo:'L001',lista:[{id:'L001',nombre:'Distribución principal',snap:null}]};
  if(c.forma===undefined){c.forma=null;c.formaTipo=null}
  d.mesas.forEach(m=>{
    if(m.largo==null||m.largo===''){const s=medidasPorDefecto(m.tipo,m.capacidad);m.largo=s.largo;m.ancho=s.ancho}
    if(m.ancho==null||m.ancho==='')m.ancho=m.largo;
    if(m.rot==null||m.rot==='')m.rot=0;
    if(m.x===undefined)m.x=null; if(m.y===undefined)m.y=null;
  });
  d.ui=d.ui||{tab:'dashboard'};
  colocarPendientes(d);
  return d;
}

  };
  const conceptos = [
    ['Planeación','Wedding planner',1],['Ceremonia','Iglesia / sede ceremonia',1],['Ceremonia','Oficiante',1],['Ceremonia','Música de ceremonia',0],

    ['Bebidas','Alcohol',1],['Bebidas','Barra de cocteles',0],
    ['Fotografía y video','Fotografía',1],['Fotografía y video','Video',0],['Fotografía y video','Sesión preboda',0],['Fotografía y video','Álbum impreso',0],
    ['Música y entretenimiento','DJ',1],['Música y entretenimiento','Audio e iluminación',1],['Música y entretenimiento','Grupo / música en vivo',0],['Música y entretenimiento','Pista de baile',0],

    ['Anillos y joyería','Anillos',1],

   CÁLCULOS (equivalen a las fórmulas de la plantilla)
   ================================================================== */
function calcGasto(g){
  const inc = g.incluir;
  const presupuesto = num(g.cantidad)*num(g.unitario);
  const proyectado = !inc?0 : g.costoFinal!==''&&g.costoFinal!=null ? num(g.costoFinal) : g.cotizacion!==''&&g.cotizacion!=null ? num(g.cotizacion) : presupuesto;
  const pagado = inc? S.pagos.filter(p=>p.gastoId===g.id&&p.estado==='Pagado').reduce((a,p)=>a+num(p.montoPag),0) : 0;
  const programado = inc? S.pagos.filter(p=>p.gastoId===g.id&&p.estado!=='Cancelado').reduce((a,p)=>a+num(p.montoProg),0):0;
  let control = !inc?'Excluido' : !g.concepto?'Falta concepto' : !g.categoria?'Falta categoría' : proyectado===0?'Sin costo' : pagado>=proyectado&&proyectado>0?'Liquidado' : 'Activo';
  return {presupuesto,proyectado,pagado,pendiente:Math.max(proyectado-pagado,0),programado,control};
}
function calcPago(p){
  const g = S.gastos.find(x=>x.id===p.gastoId);
  const t = today();
  let control;
  if(!p.gastoId) control='Falta gasto';
  else if(p.estado==='Cancelado') control='Cancelado';
  else if(p.estado==='Pagado') control = (!p.fechaPag||p.montoPag==='')?'Falta dato de pago':'Pagado';
  else if(!p.fechaProg) control='Falta fecha programada';
  else if(p.fechaProg<t) control='Vencido';
  else if(daysBetween(t,p.fechaProg)<=30) control='Próximo';
  else control='Programado';
  return {concepto:g?g.concepto:'',proveedorId:g?g.proveedorId:'',control};
}
function calcProveedor(v){
  const gastos = S.gastos.filter(g=>g.incluir&&g.proveedorId===v.id);
  const total = gastos.reduce((a,g)=>a+calcGasto(g).proyectado,0);
  const pagado = gastos.reduce((a,g)=>a+calcGasto(g).pagado,0);
  const t=today();
  let control = !v.incluir?'Excluido' : !v.empresa?'Falta nombre' : (v.seguimiento&&v.seguimiento<t&&!['Contratado','Descartado'].includes(v.estado))?'Seguimiento vencido' : (v.vigencia&&v.vigencia<t&&v.estado==='Cotizado')?'Cotización vencida' : v.estado==='Contratado'&&v.contrato!=='Sí'?'Falta contrato' : 'OK';
  return {total,pagado,saldo:Math.max(total-pagado,0),control,gastos:gastos.length};
}
function calcTarea(t){
  const fecha = t.fechaPersonalizada || (S.config.fecha? addDays(S.config.fecha,-num(t.diasAntes)) : '');
  const h=today();
  let control = !t.incluir?'Excluida' : !t.tarea?'Falta tarea' : t.estado==='Completada'?'Completada' : t.estado==='Omitida'?'Omitida' : !fecha?'Sin fecha' : fecha<h?'Vencida' : daysBetween(h,fecha)<=30?'Próxima' : 'En tiempo';
  return {fecha,control};
}
function calcInvitado(i){
  const key = i.mesa&&i.asiento? i.mesa+'|'+i.asiento : '';
  const dup = key? S.invitados.filter(x=>x.mesa===i.mesa&&x.asiento===i.asiento).length>1 : false;
  const mesaExiste = !i.mesa || S.mesas.some(m=>m.nombre===i.mesa);
  let control = !i.nombre?'Falta nombre' : i.rsvp==='Confirmado'&&!i.mesa?'Sin mesa' : !mesaExiste?'Mesa inexistente' : dup?'Asiento duplicado' : 'OK';
  return {key,dup,control};
}
function calcMesa(m){
  const asignados = S.invitados.filter(i=>i.rsvp==='Confirmado'&&i.mesa===m.nombre);
  const nombreDup = S.mesas.filter(x=>x.nombre===m.nombre).length>1;
  const cap = num(m.capacidad);
  let control = !m.nombre?'Falta nombre' : nombreDup?'Nombre duplicado' : asignados.length>cap?'Sobrecupo' : asignados.length===cap?'Llena' : 'Disponible';
  return {asignados:asignados.length,disponibles:cap-asignados.length,control,lista:asignados};
}
function calcDecision(d){
  const h=today();
  let control = !d.incluir?'Excluida' : !d.decision?'Falta decisión' : d.estado==='Decidida'?(d.eleccion?'Decidida':'Falta elección final') : d.estado==='Descartada'?'Descartada' : d.fechaLimite&&d.fechaLimite<h?'Vencida' : 'Abierta';
  return {control};
}
function calcActividad(a){
  let control = !a.actividad?'' : !a.horaInicio?'Falta hora' : !a.responsable?'Falta responsable' : a.estado==='Completada'?'Completada' : 'Lista';
  return {control};
}
function resumen(){
  const gs = S.gastos.map(g=>({g,c:calcGasto(g)}));
  const proyectado = gs.reduce((a,x)=>a+x.c.proyectado,0);
  const pagado = gs.reduce((a,x)=>a+x.c.pagado,0);
  const pagos = S.pagos.map(p=>({p,c:calcPago(p)}));
  const tareas = S.tareas.map(t=>({t,c:calcTarea(t)}));
  const invs = S.invitados.map(i=>({i,c:calcInvitado(i)}));
  const mesas = S.mesas.map(m=>({m,c:calcMesa(m)}));
  const provs = S.proveedores.map(v=>({v,c:calcProveedor(v)}));
  const decs = S.decisiones.map(d=>({d,c:calcDecision(d)}));
  const porCat = {};
  for(const cat of S.config.categorias) porCat[cat]={presupuesto:0,proyectado:0,pagado:0};
  for(const {g,c} of gs){ if(!g.incluir)continue; const k=g.categoria||'(sin categoría)'; porCat[k]=porCat[k]||{presupuesto:0,proyectado:0,pagado:0}; porCat[k].presupuesto+=c.presupuesto; porCat[k].proyectado+=c.proyectado; porCat[k].pagado+=c.pagado; }
  return {
    proyectado,pagado,pendiente:Math.max(proyectado-pagado,0),
    diferencia: num(S.config.presupuesto)-proyectado,
    contingencia: num(S.config.presupuesto)*num(S.config.contingencia)/100,
    pagosVencidos: pagos.filter(x=>x.c.control==='Vencido').length,
    pagosProximos: pagos.filter(x=>x.c.control==='Próximo').length,
    pagosProgramado: pagos.filter(x=>x.p.estado!=='Cancelado').reduce((a,x)=>a+num(x.p.montoProg),0),
    pagosPagado: pagos.filter(x=>x.p.estado==='Pagado').reduce((a,x)=>a+num(x.p.montoPag),0),
    sinCalendarizar: gs.filter(x=>x.g.incluir).reduce((a,x)=>a+Math.max(x.c.proyectado-x.c.programado,0),0),
    tareasVencidas: tareas.filter(x=>x.c.control==='Vencida').length,
    tareasProximas: tareas.filter(x=>x.c.control==='Próxima').length,
    tareasPorEstado: LISTAS.estadoTarea.map(e=>[e,S.tareas.filter(t=>t.incluir&&t.tarea&&t.estado===e).length]),
    tareasActivas: S.tareas.filter(t=>t.incluir&&t.tarea).length,
    confirmados: S.invitados.filter(i=>i.nombre&&i.rsvp==='Confirmado').length,
    declinados: S.invitados.filter(i=>i.nombre&&i.rsvp==='Declinado').length,
    pendientesRsvp: S.invitados.filter(i=>i.nombre&&i.rsvp==='Pendiente').length,
    registrados: S.invitados.filter(i=>i.nombre).length,
    adultosConf: S.invitados.filter(i=>i.nombre&&i.rsvp==='Confirmado'&&(i.edad==='Adulto'||i.edad==='Adolescente')).length,
    ninosConf: S.invitados.filter(i=>i.nombre&&i.rsvp==='Confirmado'&&(i.edad==='Niño'||i.edad==='Bebé')).length,
    sinMesa: invs.filter(x=>x.c.control==='Sin mesa').length,
    duplicados: invs.filter(x=>x.c.dup).length,
    sobrecupos: mesas.filter(x=>x.c.control==='Sobrecupo').length,
    conflictos: conflictosPlano(S).total,
    restrRotas: restriccionesRotas(),
    evacBloq: reglasEvacuacion().filter(x=>x.n==='bad').length,
    capacidad: S.mesas.reduce((a,m)=>a+num(m.capacidad),0),
    asignados: mesas.reduce((a,x)=>a+x.c.asignados,0),
    provVencidos: provs.filter(x=>x.c.control==='Seguimiento vencido'||x.c.control==='Cotización vencida').length,
    provContratados: provs.filter(x=>x.v.incluir&&x.v.estado==='Contratado').length,
    saldoProv: provs.filter(x=>x.v.incluir).reduce((a,x)=>a+x.c.saldo,0),
    decVencidas: decs.filter(x=>x.c.control==='Vencida').length,
    decResueltas: decs.filter(x=>x.c.control==='Decidida').length,
    decActivas: S.decisiones.filter(d=>d.incluir&&d.decision).length,
    porCat, gs, pagos
  };
}

function tableHTML(rows, cols, opts={}){
  const head = cols.map(c=>`<th>${c.type==='id'?'N°':esc(c.label)}</th>`).join('') + (opts.del?'<th></th>':'');
  const body = rows.map(r=>{
    const calc = r.__calc||{};
    const tds = cols.map(c=>{
      const v = c.calc? (c.get? c.get(r,calc) : calc[c.key]) : r[c.key];
      if(c.calc){
        if(c.type==='pill') return `<td class="calc">${v?pill(v):''}</td>`;
        if(c.type==='money') return `<td class="calc num">${v===''||v==null?'':money(v)}</td>`;
        if(c.type==='date') return `<td class="calc">${fmtDate(v)}</td>`;
        return `<td class="calc${c.type==='num'?' num':''}">${esc(v)}</td>`;
      }
      const a = `data-id="${esc(r.id)}" data-key="${c.key}"`;
      // El ID interno no se muestra: se ve un número consecutivo según la posición de la fila
      if(c.type==='id') return `<td class="id">${esc(r.__n??numeroFila(r.id))}</td>`;
      if(c.type==='check') return `<td><input type="checkbox" ${a} ${v?'checked':''} aria-label="${esc(c.label)}"></td>`;
      if(c.type==='select'){const o=(typeof c.options==='function'?c.options(r):c.options);
        // El ancho se ajusta al texto más largo de las opciones para que nada quede cortado
        // Las opciones pueden ser texto o {v:valor guardado, l:texto visible}
        const items=o.map(x=>typeof x==='object'?x:{v:x,l:x});
        const cur=(v??'');
        const all=(c.allowEmpty?[{v:'',l:'—'}]:[]).concat(items,(cur!==''&&!items.some(i=>i.v===cur))?[{v:cur,l:cur}]:[]);
        const len=Math.max(8,...all.map(i=>String(i.l).length));
        return `<td><select ${a} style="min-width:calc(${len}ch + 44px)">${all.map(i=>`<option value="${esc(i.v)}" ${i.v===cur?'selected':''}>${esc(i.l)}</option>`).join('')}</select></td>`}
      if(c.type==='number') return `<td class="num"><input type="number" step="any" ${a} value="${v===''||v==null?'':esc(v)}"></td>`;
      if(c.type==='date') return `<td><input type="date" ${a} value="${esc(v||'')}"></td>`;
      if(c.type==='time') return `<td><input type="time" ${a} value="${esc(v||'')}"></td>`;
      return `<td><input type="text" class="${c.w||''}" ${a} value="${esc(v??'')}" placeholder="${esc(c.ph||'')}"></td>`;
    }).join('');
    const del = opts.del?`<td><button class="del" data-del="${esc(r.id)}" title="Eliminar fila" aria-label="Eliminar fila">✕</button></td>`:'';
    return `<tr data-row="${esc(r.id)}" class="${r.__cls||''}">${tds}${del}</tr>`;
  }).join('');
  if(!rows.length) return `<div class="empty">${esc(opts.empty||'Sin registros. Usa "Agregar" para crear el primero.')}</div>`;
  return `<div class="tablewrap"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// Los inputs de fecha disparan "change" con cada dígito del año (0002, 0020, 0202, 2026).
// Solo se acepta vacío o una fecha con año de 4 dígitos razonable.
function fechaCompleta(v){ if(v==='') return true; const y=parseInt((v||'').slice(0,4),10); return /^\d{4}-\d{2}-\d{2}$/.test(v) && y>=1900 && y<=2200 }
view.addEventListener('change', e=>{
  const el=e.target; if(!el.dataset||!el.dataset.key) return;
  if(el.type==='date' && !fechaCompleta(el.value)) return;
  const list = el.closest('[data-list]')?.dataset.list; if(!list) return;
  const row = S[list].find(r=>r.id===el.dataset.id); if(!row) return;
  const val = el.type==='checkbox'? el.checked : el.value;
  const prev = {tipo:row.tipo,capacidad:row.capacidad,largo:row.largo,ancho:row.ancho}, key = el.dataset.key;
  row[key] = val;
  if(list==='mesas'){
    if(key==='tipo'||key==='capacidad'){ const d0=medidasPorDefecto(prev.tipo,prev.capacidad); if(num(prev.largo)===d0.largo&&num(prev.ancho)===d0.ancho){ const d1=medidasPorDefecto(row.tipo,row.capacidad); row.largo=d1.largo; row.ancho=d1.ancho } }
    if(key==='largo'&&esRedonda(row.tipo)) row.ancho=row.largo;
    if(key==='ancho'&&esRedonda(row.tipo)) row.largo=row.ancho;
  }
  if(list==='elementos'&&key==='tipo'){ const p0=PRESETS_ELEM[prev.tipo], p1=PRESETS_ELEM[row.tipo]; if(p0&&p1&&num(prev.largo)===p0[0]&&num(prev.ancho)===p0[1]){ row.largo=p1[0]; row.ancho=p1[1] } }
  if(list==='elementos'){
    if(key==='tipo'&&esCeremonia(row)){ row.filas=row.filas||8; row.porFila=row.porFila||10; if(row.pasilloC===undefined||row.pasilloC==='')row.pasilloC=1.2; Object.assign(row,medidasCeremonia(row)) }
    else if(esCeremonia(row)&&(key==='filas'||key==='porFila'||key==='pasilloC')) Object.assign(row,medidasCeremonia(row));
  }
  if(list==='mesas' && el.dataset.key==='nombre'){ /* renombrar mesa propaga a invitados */ const old=el.dataset.old; if(old){S.invitados.forEach(i=>{if(i.mesa===old)i.mesa=val})} }
  if(list==='pagos' && el.dataset.key==='estado' && val==='Pagado'){ if(!row.fechaPag) row.fechaPag=today(); if(row.montoPag===''||row.montoPag==null) row.montoPag=row.montoProg; }
  if(list==='tareas' && el.dataset.key==='estado' && val==='Completada' && !row.fechaCompletada) row.fechaCompletada=today();
  save();
  const ae=document.activeElement;
  pendingFocus = (ae&&ae!==el&&ae.dataset&&ae.dataset.key)?{id:ae.dataset.id,key:ae.dataset.key}:{id:el.dataset.id,key:el.dataset.key};
  render();
});
view.addEventListener('focusin', e=>{const el=e.target; if(el.dataset&&el.dataset.key==='nombre') el.dataset.old=el.value});
view.addEventListener('click', e=>{

const LIST_BY_PREFIX={G:'gastos',P:'pagos',V:'proveedores',T:'tareas',I:'invitados',M:'mesas',A:'dia',D:'decisiones',E:'elementos',R:'restricciones',Q:'cotizaciones',C:'liturgia',N:'participantes'};

const TOOLBAR_LIST={presupuesto:'gastos',pagos:'pagos',proveedores:'proveedores',cronograma:'tareas',invitados:'invitados',decisiones:'decisiones'};
function numeroFila(id){const k=LIST_BY_PREFIX[(id||'')[0]];if(!k)return id;const i=S[k].findIndex(x=>x.id===id);return i<0?'':i+1}
// Al borrar filas se limpian los vínculos que apuntaban a ellas
function limpiarReferencias(k,ids,nombres){
  const set=new Set(ids);
  if(k==='proveedores'){['gastos','tareas','dia','cotizaciones'].forEach(l=>S[l].forEach(x=>{if(set.has(x.proveedorId))x.proveedorId=''}))}
  if(k==='gastos'){S.pagos.forEach(p=>{if(set.has(p.gastoId))p.gastoId=''});S.cotizaciones.forEach(q=>{if(set.has(q.gastoId))q.gastoId=''})}
  if(k==='invitados'){S.restricciones=(S.restricciones||[]).filter(r=>!set.has(r.a)&&!set.has(r.b))}
  if(k==='mesas'){const ns=new Set(nombres||[]);S.invitados.forEach(i=>{if(ns.has(i.mesa)){i.mesa='';i.asiento=''}});}
  const s=S.ui.sel; if(s&&!(S[s.kind]||[]).some(x=>x.id===s.id)) S.ui.sel=null;
}
function vaciarLista(k){
  const n=S[k].length; if(!n){toast('La tabla ya está vacía');return}

    const ids=S[k].map(r=>r.id), nombres=k==='mesas'?S.mesas.map(m=>m.nombre):[];

  });
}

function mesesRango(){
  const c=S.config; const ini=c.inicio||today(); const fin=c.fecha||addDays(today(),365);
  const out=[]; let d=new Date(ini.slice(0,7)+'-01T00:00:00'); const end=new Date(fin.slice(0,7)+'-01T00:00:00');
  let guard=0; while(d<=end && guard<36){out.push(d.toISOString().slice(0,7));d.setMonth(d.getMonth()+1);guard++}
  return out;
}
function chartPagos(r){
  const meses = mesesRango();
  const data = meses.map(m=>({m,prog:0,pag:0}));
  for(const {p} of r.pagos){ if(p.estado==='Cancelado')continue; const k=(p.fechaProg||'').slice(0,7); const d=data.find(x=>x.m===k); if(d)d.prog+=num(p.montoProg); if(p.estado==='Pagado'){const kp=(p.fechaPag||p.fechaProg||'').slice(0,7);const dp=data.find(x=>x.m===kp);if(dp)dp.pag+=num(p.montoPag)} }
  const max = Math.max(1,...data.map(d=>Math.max(d.prog,d.pag)));
  const W=Math.max(600,meses.length*54), H=220, pad={l:10,r:10,t:16,b:30}; const bw=(W-pad.l-pad.r)/meses.length;
  const hoyM=today().slice(0,7);
  const bars = data.map((d,i)=>{
    const x=pad.l+i*bw; const h1=(H-pad.t-pad.b)*d.prog/max; const h2=(H-pad.t-pad.b)*d.pag/max;
    const lbl=new Date(d.m+'-01T00:00:00').toLocaleDateString('es-MX',{month:'short'});
    return `<g><rect x="${x+bw*0.18}" y="${H-pad.b-h1}" width="${bw*0.3}" height="${h1}" rx="3" fill="var(--gold)" opacity=".9"><title>${esc(fmtMes(d.m))}: programado ${money(d.prog)}</title></rect><rect x="${x+bw*0.52}" y="${H-pad.b-h2}" width="${bw*0.3}" height="${h2}" rx="3" fill="var(--sage)"><title>${esc(fmtMes(d.m))}: pagado ${money(d.pag)}</title></rect><text x="${x+bw/2}" y="${H-10}" text-anchor="middle" ${d.m===hoyM?'font-weight="700" fill="var(--plum)"':''}>${lbl}${d.m.endsWith('-01')||i===0?' '+d.m.slice(2,4):''}</text></g>`;
  }).join('');
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${W}px"><line x1="${pad.l}" x2="${W-pad.r}" y1="${H-pad.b}" y2="${H-pad.b}" stroke="var(--line-2)"/>${bars}</svg></div><div class="legend"><span><i style="background:var(--gold)"></i>Programado</span><span><i style="background:var(--sage)"></i>Pagado</span><span style="margin-left:auto">Máximo mensual ${money(max)}</span></div>`;
}
function fmtMes(m){return new Date(m+'-01T00:00:00').toLocaleDateString('es-MX',{month:'long',year:'numeric'})}

function existeKey(k){const [kind,id]=k.split(':');return !!(S[kind]&&S[kind].some(x=>x.id===id))}

function alinear(modo){
  const its=selItems(true).map(o=>o.it); if(its.length<2){toast('Selecciona 2 o más piezas (Shift + clic)');return}
  const bb=its.map(aabb),mn=k=>Math.min(...bb.map(q=>q[k])),mx=k=>Math.max(...bb.map(q=>q[k]));
  its.forEach((it,i)=>{const b=bb[i];

    else if(modo==='der')it.x=r2(num(it.x)+mx('x1')-b.x1);

function distribuir(eje){

  const arr=its.map(it=>({it,b:aabb(it)})).sort((u,v)=>(u.b[a0]+u.b[a1])-(v.b[a0]+v.b[a1]));

function iniciarArrastre(e){
  if(e.button>0)return;
  const g=e.target.closest('.item'); if(!g)return;
  const kind=g.dataset.kind,id=g.dataset.id,it=S[kind].find(x=>x.id===id); if(!it)return;
  const key=kind+':'+id, extender=e.shiftKey||e.ctrlKey||e.metaKey, enGrupo=(S.ui.multi||[]).includes(key);
  const grupo=(enGrupo?selItems(true):[{kind,id,it}]).map(o=>({o:o.it,g:view.querySelector(`.item[data-kind="${o.kind}"][data-id="${CSS.escape(o.id)}"]`),x0:num(o.it.x),y0:num(o.it.y)}));

  const L=num(S.config.salonL)||30,A=num(S.config.salonA)||20; let moved=false;

    const dx=ev.clientX-px,dy=ev.clientY-py;

    const sn=num(S.ui.snap)||0.5, p0=grupo.find(q=>q.o===it)||grupo[0];

    grupo.forEach(q=>{q.o.x=r2(Math.min(L,Math.max(0,q.x0+nx)));q.o.y=r2(Math.min(A,Math.max(0,q.y0+ny)));if(q.g)q.g.setAttribute('transform',`translate(${q.o.x*100} ${q.o.y*100})`)});
  };

    else{ if(enGrupo)S.ui.sel={kind,id}; else{S.ui.sel={kind,id};S.ui.multi=[]} }

function pdfDeJpeg(jpg,w,h){

  const obj=(n,body,stream)=>{offs[n]=len;push(`${n} 0 obj\n${body}`);if(stream){push('\nstream\n');push(stream);push('\nendstream')}push('\nendobj\n')};

  obj(4,`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>`,jpg);
  const c=`q ${iw.toFixed(2)} 0 0 ${ih.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
  obj(5,`<< /Length ${c.length} >>`,c);

/* ---- Forma del salón (polígono) ---- */
let modoForma=false, modoMano=false;
function rectPoligono(L,A){return[[0,0],[L,0],[L,A],[0,A]]}
function formaPreset(tipo,L,A){
  const f=(a,b)=>[r2(a*L),r2(b*A)];
  if(tipo==='L')return[f(0,0),f(0.5,0),f(0.5,0.5),f(1,0.5),f(1,1),f(0,1)];
  if(tipo==='T')return[f(0,0),f(1,0),f(1,0.4),f(0.65,0.4),f(0.65,1),f(0.35,1),f(0.35,0.4),f(0,0.4)];
  if(tipo==='U')return[f(0,0),f(0.3,0),f(0.3,0.6),f(0.7,0.6),f(0.7,0),f(1,0),f(1,1),f(0,1)];
  return null;
}
function normalizarForma(c){
  if(!polySalon(c))return;
  c.forma=c.forma.map(p=>[Math.max(0,r2(p[0])),Math.max(0,r2(p[1]))]);
  c.salonL=Math.max(3,r2(Math.max(...c.forma.map(p=>p[0]))));c.salonA=Math.max(3,r2(Math.max(...c.forma.map(p=>p[1]))));
}
function cambiarForma(tipo){

  else if(tipo==='custom'){if(!polySalon(c))c.forma=rectPoligono(L,A);c.formaTipo='custom';modoForma=true}
  else{c.forma=formaPreset(tipo,L,A);c.formaTipo=tipo;modoForma=false}

}

/* ---- Restricciones entre invitados ---- */
function calcRestriccion(r){

  const control=!a||!b?'Falta invitado':r.a===r.b?'Mismo invitado':(!a.mesa||!b.mesa)?'Sin asignar':r.tipo==='Juntos'?(a.mesa===b.mesa?'OK':'Rompe restricción'):(a.mesa===b.mesa?'Rompe restricción':'OK');

/* ---- Asignación automática de invitados a mesas ---- */
function autoAsignar(todos){
  const mesas=S.mesas.filter(m=>m.nombre&&m.tipo!=='Mesa de honor');
  if(!mesas.length){toast('No hay mesas disponibles para asignar');return}
  const honor=new Set(S.mesas.filter(m=>m.tipo==='Mesa de honor').map(m=>m.nombre));
  const conf=S.invitados.filter(i=>i.nombre&&i.rsvp==='Confirmado');
  if(todos)conf.forEach(i=>{if(!honor.has(i.mesa)){i.mesa='';i.asiento=''}});
  const libre={};mesas.forEach(m=>{libre[m.nombre]=Math.max(0,num(m.capacidad)-conf.filter(i=>i.mesa===m.nombre).length)});
  const pend=conf.filter(i=>!i.mesa);
  if(!pend.length){toast('No hay confirmados sin mesa');return}
  const padre=new Map(pend.map(i=>[i.id,i.id]));
  const raiz=x=>{while(padre.get(x)!==x){padre.set(x,padre.get(padre.get(x)));x=padre.get(x)}return x};
  const une=(a,b)=>{if(padre.has(a)&&padre.has(b))padre.set(raiz(a),raiz(b))};
  const porHogar={};pend.forEach(i=>{if(i.hogar)(porHogar[i.hogar]=porHogar[i.hogar]||[]).push(i.id)});
  Object.values(porHogar).forEach(l=>l.slice(1).forEach(x=>une(l[0],x)));
  S.restricciones.filter(r=>r.tipo==='Juntos').forEach(r=>une(r.a,r.b));
  const un={};pend.forEach(i=>{(un[raiz(i.id)]=un[raiz(i.id)]||[]).push(i)});
  const gOrd=g=>{const k=(S.config.grupos||[]).indexOf(g);return k<0?999:k};
  const U=Object.values(un).sort((a,b)=>gOrd(a[0].grupo)-gOrd(b[0].grupo)||(a[0].grupo||'').localeCompare(b[0].grupo||'')||b.length-a.length);
  const enMesa=(id,n)=>{const g=S.invitados.find(x=>x.id===id);return !!g&&g.mesa===n};
  const choca=(i,n)=>S.restricciones.some(r=>r.tipo==='Separados'&&((r.a===i.id&&enMesa(r.b,n))||(r.b===i.id&&enMesa(r.a,n))));
  const afinidad=(mi,n)=>conf.reduce((s,x)=>s+(x.mesa===n?((mi.hogar&&x.hogar===mi.hogar)?3:0)+((mi.grupo&&x.grupo===mi.grupo)?1:0):0),0);
  const poner=(i,n)=>{const oc=new Set(S.invitados.filter(x=>x.mesa===n).map(x=>String(x.asiento)));let a=1;while(oc.has(String(a)))a++;i.mesa=n;i.asiento=String(a);libre[n]--};
  let sinCupo=0,divididos=0;
  U.forEach(u=>{
    const cand=mesas.filter(m=>libre[m.nombre]>=u.length&&!u.some(i=>choca(i,m.nombre)));
    if(cand.length){
      cand.sort((a,b)=>u.reduce((s,i)=>s+afinidad(i,b.nombre)-afinidad(i,a.nombre),0));
      u.forEach(i=>poner(i,cand[0].nombre));return;
    }
    if(u.length>1)divididos++;
    u.forEach(i=>{
      const c=mesas.filter(m=>libre[m.nombre]>=1&&!choca(i,m.nombre));
      if(!c.length){sinCupo++;return}
      c.sort((a,b)=>afinidad(i,b.nombre)-afinidad(i,a.nombre));poner(i,c[0].nombre);
    });
  });
  save();render();
  const n=pend.length-sinCupo;
  toast(`${n} invitados asignados${divididos?` · ${divididos} grupos no cupieron juntos`:''}${sinCupo?` · ${sinCupo} sin lugar (faltan mesas o hay restricciones)`:''}`);
}

const LAT1={'…':'\x85','–':'-','—':'-','“':'"','”':'"','‘':"'",'’':"'",'•':'\x95'};
function lat1(s){return String(s??'').replace(/[^\x00-\xFF]|[…•]/g,c=>LAT1[c]||'?')}
function pdfEsc(s){return lat1(s).replace(/[\\()]/g,m=>'\\'+m)}
class PdfDoc{

  ancho(s,size,bold){this.cx.font=`${bold?'bold ':''}${size}px Helvetica, Arial, sans-serif`;return this.cx.measureText(lat1(s)).width}
  cortar(s,size,bold,max){s=String(s??'');if(this.ancho(s,size,bold)<=max)return s;while(s.length>1&&this.ancho(s+'…',size,bold)>max)s=s.slice(0,-1);return s+'…'}

    const w=this.ancho(s,size,bold);let px=align==='c'?x-w/2:align==='r'?x-w:x;
    const py=this.h-y;
    this.cur.ops.push(rot180?`BT /${bold?'F2':'F1'} ${size} Tf ${gris} g -1 0 0 -1 ${(px+w).toFixed(2)} ${(py-0).toFixed(2)} Tm (${pdfEsc(s)}) Tj ET`:`BT /${bold?'F2':'F1'} ${size} Tf ${gris} g ${px.toFixed(2)} ${py.toFixed(2)} Td (${pdfEsc(s)}) Tj ET`);
  }

  rect(x,y,w,h,o={}){const{lw=0.5,gris=0.7,dash=null,fill=null}=o;this.cur.ops.push(`q ${lw} w ${gris} G ${dash?`[${dash}] 0 d`:''} ${fill!==null?fill+' g':''} ${x.toFixed(2)} ${(this.h-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill!==null?'B':'S'} Q`)}

    obj(2,`<< /Type /Pages /Kids [${this.pages.map((_,i)=>`${5+i*2} 0 R`).join(' ')}] /Count ${n} >>`);
    obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

      const st=enc(p.ops.join('\n'));
      obj(5+i*2,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.w} ${this.h}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+i*2} 0 R >>`);

}

function iniciarMarquesina(e,svg){

function capacidadSalon(o){
  const cap=Math.max(1,Math.round(o.pm)||1),n=Math.ceil((o.inv||0)/cap),med=medidasPorDefecto(o.tipo,cap),sil=0.5,pas=o.pas;
  const huella=esRedonda(o.tipo)||o.tipo==='Cuadrada'?Math.pow(med.largo+2*sil+pas,2):(med.largo+2*sil+pas)*(med.ancho+2*sil+pas);
  const mesas=n*huella,req=mesas+o.elem,ocup=o.area>0?req/o.area:Infinity;
  const maxMesas=Math.floor(Math.max(o.area-o.elem,0)/huella);
  return{n,cap,med,huella,mesas,req,ocup,maxInv:maxMesas*cap,maxMesas,areaMin:req/0.85,
    veredicto:ocup<=0.8?['ok','Cabe cómodo']:ocup<=1?['warn','Cabe justo']:['bad','No cabe']};
}

/* ---- 2) Seguridad y rutas de evacuación ---- */
const radioDespeje=s=>Math.max(num(s.largo)||1,num(s.ancho)||1)/2+0.8;
function reglasEvacuacion(){
  const c=S.config,out=[],max=num(c.evacMax)||25;
  const salidas=S.elementos.filter(e=>TIPOS_PUERTA.has(e.tipo)&&!sinUbicar(e));
  const emerg=salidas.filter(e=>e.tipo==='Salida de emergencia');
  const mesasU=S.mesas.filter(m=>!sinUbicar(m)),conf=S.invitados.filter(i=>i.nombre&&i.rsvp==='Confirmado').length;
  if(!mesasU.length)return out;
  if(!salidas.length){out.push({n:'bad',t:'No hay puertas ni salidas de emergencia colocadas en el plano. Agrégalas desde "+ Elemento".'});return out}
  if(!emerg.length)out.push({n:'warn',t:'No hay una "Salida de emergencia" en el plano. Agrega al menos una, distinta de la entrada principal.'});
  if(Math.max(conf,num(c.invitadosEst))>100&&salidas.length<2)out.push({n:'warn',t:'Con más de 100 invitados conviene tener al menos 2 salidas distintas.'});
  const obst=[...mesasU,...S.elementos.filter(e=>!sinUbicar(e)&&!esZona(e.tipo)&&!TIPOS_PUERTA.has(e.tipo))];
  salidas.forEach(s=>{
    const circ={t:'c',cx:num(s.x),cy:num(s.y),r:radioDespeje(s)};
    obst.forEach(it=>{if(solapaF(circ,huella(it,0)))out.push({n:'bad',t:`"${it.nombre}" bloquea el paso de "${s.nombre}" (deben quedar ${r1(radioDespeje(s)-Math.max(num(s.largo)||1,num(s.ancho)||1)/2)} m libres frente a la salida).`,key:(it.id[0]==='M'?'mesas:':'elementos:')+it.id})});
  });
  const lejos=mesasU.map(m=>({m,d:Math.min(...salidas.map(s=>Math.hypot(num(m.x)-num(s.x),num(m.y)-num(s.y))))})).filter(x=>x.d>max);
  if(lejos.length)out.push({n:'warn',t:`${lejos.length} mesa(s) están a más de ${max} m de la salida más cercana: ${lejos.slice(0,4).map(x=>x.m.nombre+' ('+r1(x.d)+' m)').join(', ')}${lejos.length>4?'…':''}.`});
  return out;
}
function evacHTML(){
  const l=reglasEvacuacion(),sal=S.elementos.filter(e=>TIPOS_PUERTA.has(e.tipo)&&!sinUbicar(e)).length;
  return `<div class="card" style="margin-top:12px"><h3>Seguridad y rutas de evacuación</h3>
    <p class="help">Revisa que ninguna mesa ni elemento tape el paso frente a puertas y salidas (círculo punteado en el plano), y la distancia a la salida más cercana. Es una guía de planeación: confirma siempre con protección civil del venue.</p>
    ${l.length?`<div class="alerts" style="margin-top:8px">${l.map(x=>`<div class="row ${x.n==='bad'?'hot':''}"><span>${esc(x.t)}</span><span class="n"><span class="pill ${x.n}">${x.n==='bad'?'Bloqueo':'Revisar'}</span></span></div>`).join('')}</div>`:`<p style="margin-top:8px"><span class="pill ok">OK</span> ${sal?`${sal} salida(s) despejadas y mesas dentro de la distancia máxima.`:'Aún no hay mesas ubicadas.'}</p>`}</div>`;
}

/* ---- 3) Mantelería, sillas y cubiertos ---- */
function rentaCalc(){
  const modo=S.ui.rentaModo||'asig',mg=Math.max(0,num(S.ui.rentaMargen!==undefined?S.ui.rentaMargen:5))/100;
  const caida=0.3,man={},tipos={};let base=0,mesasUsadas=0;
  S.mesas.filter(m=>m.nombre).forEach(m=>{
    const b=modo==='cap'?num(m.capacidad):calcMesa(m).asignados;if(b<=0)return;
    base+=b;mesasUsadas++;tipos[m.tipo]=(tipos[m.tipo]||0)+1;
    const w=num(m.largo)||1,h=num(m.ancho)||w;
    const lbl=esRedonda(m.tipo)?`Redondo Ø ${r1(w+2*caida)} m`:m.tipo==='Ovalada'?`Ovalado ${r1(w+2*caida)} × ${r1(h+2*caida)} m`:`Rectangular ${r1(Math.max(w,h)+2*caida)} × ${r1(Math.min(w,h)+2*caida)} m`;
    man[lbl]=(man[lbl]||0)+1;
  });
  const sillasCer=S.elementos.filter(e=>esCeremonia(e)).reduce((a,e)=>a+sillasCeremonia(e),0);
  const sillasMesas=Math.ceil(base*(1+mg));
  return{modo,mg,base,mesasUsadas,sillasMesas,sillasCer,sillas:sillasMesas+sillasCer,cubiertos:Math.ceil(base*(1+mg)),manteles:Object.entries(man).sort(),tipos:Object.entries(tipos).sort()};
}

      <select id="rentaModo"><option value="asig" ${f==='asig'?'selected':''}>Invitados sentados</option><option value="cap" ${f==='cap'?'selected':''}>Capacidad de las mesas</option></select></label>
      <label class="medida">Margen extra (%) <input type="number" id="rentaMargen" min="0" max="50" step="1" value="${S.ui.rentaMargen!==undefined?S.ui.rentaMargen:5}"></label><span class="spacer"></span>

function ordenMontaje(){return S.mesas.filter(m=>m.nombre&&!sinUbicar(m)).sort((a,b)=>(Math.floor(num(a.y)/2.5)-Math.floor(num(b.y)/2.5))||(num(a.x)-num(b.x)))}
function planoVector(d,X,Y,W,H,numerar){
  const c=S.config,L=num(c.salonL)||30,A=num(c.salonA)||20,s=Math.min(W/L,H/A),ox=X+(W-L*s)/2,oy=Y,P=([x,y])=>[ox+x*s,oy+y*s];
  d.poli((polySalon(c)||rectPoligono(L,A)).map(P),{gris:0.25,lw:1,fill:0.975});
  S.elementos.filter(e=>!sinUbicar(e)).forEach(e=>{
    const w=num(e.largo)||1,h=num(e.ancho)||1,zona=esZona(e.tipo),pts=rectPts(num(e.x),num(e.y),w,h,num(e.rot)).map(P);
    d.poli(pts,{gris:zona?0.6:0.4,lw:zona?0.8:0.6,fill:zona?null:TIPOS_PUERTA.has(e.tipo)?0.7:0.9,dash:zona?'3 2':null});
    const[cx,cy]=P([num(e.x),num(e.y)]);if(w*s>=26)d.texto(cx,cy+2.5,e.nombre,{size:6.5,align:'c',gris:0.25,max:w*s-2});
  });
  const orden=ordenMontaje();
  S.mesas.filter(m=>!sinUbicar(m)).forEach(m=>{
    const w=num(m.largo)||1,h=num(m.ancho)||w,[cx,cy]=P([num(m.x),num(m.y)]),o={gris:0.2,lw:0.7,fill:1};
    if(esRedonda(m.tipo))d.circ(cx,cy,w/2*s,o);
    else if(m.tipo==='Ovalada'){const a=(num(m.rot)||0)*Math.PI/180;d.poli(Array.from({length:28},(_,i)=>{const t=i/28*2*Math.PI,px=Math.cos(t)*w/2,py=Math.sin(t)*h/2;return P([num(m.x)+px*Math.cos(a)-py*Math.sin(a),num(m.y)+px*Math.sin(a)+py*Math.cos(a)])}),o)}
    else d.poli(rectPts(num(m.x),num(m.y),w,h,num(m.rot)).map(P),o);
    const lbl=numerar?String(orden.indexOf(m)+1):(m.nombre.replace(/^Mesa\s+/i,'')||m.nombre);
    d.texto(cx,cy+3,lbl,{size:Math.max(6,Math.min(10,w*s*0.45)),bold:true,align:'c'});
  });
  d.texto(ox,oy+A*s+12,`Salón ${r1(L)} × ${r1(A)} m · cuadrícula de referencia en la tabla`,{size:7.5,gris:0.45});
}

/* ---- 7) Vista por horas (día del evento) ---- */
function ganttDia(){
  const acts=S.dia.filter(a=>a.actividad&&hm(a.horaInicio)!==null).map(a=>{const s=hm(a.horaInicio);let e=hm(a.horaFin);if(e===null||e<=s)e=s+30;return{a,s,e,r:a.responsable||'Sin responsable'}});
  if(!acts.length)return '<p class="help">Asigna hora de inicio a las actividades de la tabla para ver aquí la vista por horas.</p>';
  if(acts.some(x=>x.s>=720))acts.forEach(x=>{if(x.s<360){x.s+=1440;x.e+=1440}else if(x.e<=x.s)x.e+=1440});
  const h0=Math.floor(Math.min(...acts.map(x=>x.s))/60),h1=Math.ceil(Math.max(...acts.map(x=>x.e))/60),span=Math.max(60,(h1-h0)*60);
  const lanes={};acts.forEach(x=>(lanes[x.r]=lanes[x.r]||[]).push(x));let choques=0;
  const ticks=Array.from({length:h1-h0+1},(_,i)=>`<span style="left:${i*60/span*100}%">${String((h0+i)%24).padStart(2,'0')}:00</span>`).join('');
  let html=`<div class="gantt"><div class="gh"><div class="gl0"></div><div class="gtrack hh">${ticks}</div></div>`;
  Object.entries(lanes).forEach(([r,list])=>{
    list.sort((a,b)=>a.s-b.s);const rows=[];
    list.forEach(x=>{let k=rows.findIndex(end=>end<=x.s);if(k<0){k=rows.length;rows.push(0)}if(k>0){x.choque=true;choques++}rows[k]=x.e;x.row=k});
    html+=`<div class="glane"><div class="gl0">${esc(r)}</div><div class="gtrack" style="height:${Math.max(1,rows.length)*28+4}px">${list.map(x=>`<div class="gbar ${x.choque?'choque':''} ${x.a.estado==='Completada'?'done':''}" style="left:${(x.s-h0*60)/span*100}%;width:${Math.max((x.e-x.s)/span*100,1.2)}%;top:${x.row*28+2}px" title="${esc(x.a.horaInicio)}${x.a.horaFin?' – '+esc(x.a.horaFin):''} · ${esc(x.a.actividad)}${x.choque?' (empalmada con otra actividad del mismo responsable)':''}">${esc(x.a.actividad)}</div>`).join('')}</div></div>`;
  });
  return html+`</div>${choques?`<p class="help" style="margin-top:10px"><span class="pill warn">Revisar</span> ${choques} actividad(es) se empalman con otra del mismo responsable (en naranja).</p>`:''}`;
}

const CRC_T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  const gs=S.gastos.filter(g=>g.incluir&&g.concepto),cot=S.cotizaciones;
  const cols=[{key:'id',label:'ID',type:'id'},{key:'gastoId',label:'Concepto',type:'select',options:()=>gs.map(g=>({v:g.id,l:`${S.gastos.indexOf(g)+1} · ${g.concepto}`})),allowEmpty:true},{key:'proveedorId',label:'Proveedor',type:'select',options:provOptions,allowEmpty:true},{key:'precio',label:'Precio',type:'number'},{key:'incluye',label:'Qué incluye',type:'text',w:'xwide'},{key:'calif',label:'Calificación (1-5)',type:'select',options:['1','2','3','4','5'],allowEmpty:true},{key:'vigencia',label:'Vigencia',type:'date'},{key:'elegida',label:'Elegida',type:'check'},{key:'notas',label:'Notas',type:'text',w:'wide'}];
  const grupos={};cot.filter(q=>q.gastoId&&num(q.precio)>0).forEach(q=>(grupos[q.gastoId]=grupos[q.gastoId]||[]).push(q));
  const cards=Object.entries(grupos).map(([gid,lst])=>{
    const g=S.gastos.find(x=>x.id===gid);if(!g)return '';lst.sort((a,b)=>num(a.precio)-num(b.precio));
    const min=num(lst[0].precio),mejor=Math.max(...lst.map(q=>num(q.calif))),pres=calcGasto(g).presupuesto;
    return `<div class="card"><h3>${esc(g.concepto)}</h3><p class="help">${pres?`Presupuestado ${money(pres)}`:'Sin presupuesto asignado'}${g.proveedorId?` · actual: ${esc(provLabel(g.proveedorId))}`:''}</p><div style="margin-top:8px">${lst.map(q=>`<div class="ckrow ${q.elegida?'llego':''}" style="grid-template-columns:1fr auto auto"><div class="ckn"><b>${q.proveedorId?esc(provLabel(q.proveedorId)):'(sin proveedor)'}</b><span class="s">${esc(q.incluye||'')}</span>${num(q.precio)===min&&lst.length>1?'<span class="pill ok" style="align-self:flex-start">Más barata</span>':''}${mejor>0&&num(q.calif)===mejor&&lst.length>1?'<span class="pill plum" style="align-self:flex-start">Mejor calificada</span>':''}</div><div class="ckm"><span class="big">${money(num(q.precio))}</span><span class="s">${q.calif?'★'.repeat(num(q.calif)):''} ${pres?(num(q.precio)>pres?'+':'')+money(num(q.precio)-pres)+' vs presupuesto':''}</span></div><button class="btn ${q.elegida?'':'primary'}" data-celegir="${esc(q.id)}">${q.elegida?'✓ Elegida':'Elegir'}</button></div>`).join('')}</div></div>`}).join('');
  view.innerHTML=`${cards?`<div class="grid g2">${cards}</div>`:'<div class="card"><p class="help">Agrega cotizaciones en la tabla (concepto + proveedor + precio). Con dos o más del mismo concepto aparece aquí la comparación.</p></div>'}
    <div style="margin:18px 0 12px" class="legendkey"><span><i class="e"></i>Editable</span></div>
    <div data-list="cotizaciones"><div class="toolbar"><span class="spacer"></span><button class="btn danger" id="clearQ">Vaciar tabla</button><button class="btn primary" id="addQ">+ Agregar cotización</button></div>${tableHTML(cot,cols,{del:true,empty:'Sin cotizaciones.'})}</div>`;
  $('#clearQ').onclick=()=>vaciarLista('cotizaciones');
  $('#addQ').onclick=()=>{S.cotizaciones.push({id:nextId(S.cotizaciones,'Q'),gastoId:'',proveedorId:'',precio:'',incluye:'',calif:'',vigencia:'',elegida:false,notas:''});save();pendingFocus={id:S.cotizaciones[S.cotizaciones.length-1].id,key:'gastoId'};render()};
  view.querySelectorAll('[data-celegir]').forEach(b=>b.onclick=()=>{
    const q=S.cotizaciones.find(x=>x.id===b.dataset.celegir),g=q&&S.gastos.find(x=>x.id===q.gastoId);if(!q||!g)return;
    S.cotizaciones.filter(x=>x.gastoId===q.gastoId).forEach(x=>x.elegida=false);q.elegida=true;
    g.cotizacion=num(q.precio);if(q.proveedorId)g.proveedorId=q.proveedorId;if(g.estado==='Por cotizar')g.estado='Cotizado';
    save();render();toast('Cotización elegida: el Presupuesto se actualizó');
  });
};
/* ---- comparar distribuciones y sustituciones (dentro de Mesas) ---- */
function layoutsMetricas(){
  return S.layouts.lista.map(l=>{
    const act=l.id===S.layouts.activo,c=S.config;
    const d=act?{mesas:S.mesas,elementos:S.elementos,salon:{L:c.salonL,A:c.salonA,pasillo:c.pasillo,forma:c.forma||null,formaTipo:c.formaTipo||null}}:l.snap;
    if(!d)return null;
    const cc={...c,salonL:d.salon.L,salonA:d.salon.A,pasillo:d.salon.pasillo,forma:d.salon.forma,formaTipo:d.salon.formaTipo};
    let conf=0;try{conf=conflictosPlano({config:cc,mesas:d.mesas,elementos:d.elementos}).total}catch(e){}
    const asig=act?S.invitados.filter(i=>i.rsvp==='Confirmado'&&i.mesa).length:Object.entries(l.snap.asig||{}).filter(([id,a])=>a&&a[0]&&(S.invitados.find(i=>i.id===id)||{}).rsvp==='Confirmado').length;
    return{id:l.id,nombre:l.nombre,act,area:areaSalon(cc),dims:d.salon.forma?'forma libre':`${r1(num(d.salon.L))} × ${r1(num(d.salon.A))} m`,mesas:d.mesas.length,cap:d.mesas.reduce((a,m)=>a+num(m.capacidad),0),asig,conf};
  }).filter(Boolean);
}
function layoutsCompareHTML(){
  if(S.layouts.lista.length<2)return '';
  const m=layoutsMetricas(),conf=S.invitados.filter(i=>i.rsvp==='Confirmado').length;
  return `<div class="section-title"><h2>Comparar distribuciones</h2><p>Plan A / Plan B lado a lado</p></div><div class="card"><div class="tablewrap"><table class="simple"><thead><tr><th>Distribución</th><th>Salón</th><th>Área</th><th>Mesas</th><th>Capacidad</th><th>Sentados</th><th>Conflictos</th><th></th></tr></thead><tbody>${m.map(x=>`<tr><td><b>${esc(x.nombre)}</b> ${x.act?'<span class="pill ok">Activa</span>':''}</td><td>${x.dims}</td><td class="num">${Math.round(x.area)} m²</td><td class="num">${x.mesas}</td><td class="num">${x.cap} ${x.cap<conf?'<span class="pill bad">Faltan '+(conf-x.cap)+'</span>':''}</td><td class="num">${x.asig} de ${conf}</td><td class="num">${x.conf?'<span class="pill bad">'+x.conf+'</span>':'<span class="pill ok">0</span>'}</td><td>${x.act?'':`<button class="btn small" data-lswitch="${esc(x.id)}">Cambiar a esta</button>`}</td></tr>`).join('')}</tbody></table></div><p class="help" style="margin-top:8px">Capacidad = lugares totales de las mesas; si es menor que los confirmados, esa distribución no alcanza.</p></div>`;
}
function sugerenciasSustitucion(){
  const libres={};S.mesas.filter(m=>m.nombre).forEach(m=>{libres[m.nombre]=num(m.capacidad)-calcMesa(m).asignados});
  const sep=(S.restricciones||[]).filter(r=>r.tipo==='Separados');
  return S.invitados.filter(i=>i.nombre&&i.rsvp==='Confirmado'&&!i.mesa).map(i=>{
    let best=null;
    S.mesas.filter(m=>m.nombre&&libres[m.nombre]>0).forEach(m=>{
      const gente=S.invitados.filter(x=>x.mesa===m.nombre&&x.rsvp==='Confirmado');
      if(sep.some(r=>(r.a===i.id&&gente.some(x=>x.id===r.b))||(r.b===i.id&&gente.some(x=>x.id===r.a))))return;
      const sc=(i.hogar&&gente.some(x=>x.hogar===i.hogar)?10:0)+(i.grupo&&gente.filter(x=>x.grupo===i.grupo).length>=2?3:0)+libres[m.nombre]/100;
      if(!best||sc>best.sc)best={m,sc,mismoHogar:i.hogar&&gente.some(x=>x.hogar===i.hogar)};
    });
    return{i,best};
  });
}
function sustitucionesHTML(){
  const lib=S.invitados.filter(i=>i.nombre&&i.rsvp==='Declinado'&&i.mesa),sug=sugerenciasSustitucion();
  if(!lib.length&&!sug.length)return '';
  return `<div class="section-title"><h2>Lugares liberados y sustituciones</h2><p>Cuando alguien cancela, libera su lugar y sienta a quien sigue</p></div><div class="grid g2">
    <div class="card"><h3>Declinaron y siguen con mesa</h3>${lib.length?`<div class="alerts" style="margin-top:8px">${lib.map(i=>`<div class="row"><span>${esc(i.nombre)} · ${esc(i.mesa)}</span><span class="n"><button class="btn small" data-liberar="${esc(i.id)}">Liberar lugar</button></span></div>`).join('')}</div><div class="rotbtns"><button class="btn small" id="liberarTodos">Liberar todos</button></div>`:'<p class="help">Ninguno.</p>'}</div>
    <div class="card"><h3>Confirmados sin mesa: sugerencias</h3>${sug.length?`<div class="alerts" style="margin-top:8px">${sug.slice(0,10).map(({i,best})=>`<div class="row"><span>${esc(i.nombre)} → ${best?`<b>${esc(best.m.nombre)}</b>${best.mismoHogar?' (misma familia)':''}`:'sin lugar libre'}</span><span class="n">${best?`<button class="btn small" data-sentarsug="${esc(i.id)}|${esc(best.m.nombre)}">Sentar</button>`:''}</span></div>`).join('')}</div>`:'<p class="help">Todos los confirmados tienen mesa.</p>'}</div></div>`;
}

/* ==================================================================
   v11: Insumos y bar
   ================================================================== */
function nuevosInsumos(){return{horas:5,perfil:'Moderado',barra:'Abierta',calor:true,noBeben:15,brindis:true,margen:10,coctel:1,canapes:true,pastel:true,postres:false,reparto:{Cerveza:30,Vino:15,Tequila:20,Whisky:15,Ron:10,Vodka:10},precios:{}}}
const PERFIL_F={Ligero:0.75,Moderado:1,Alto:1.3};
const BARRAS={'Abierta':['Cerveza','Vino','Tequila','Whisky','Ron','Vodka'],'Solo cerveza y vino':['Cerveza','Vino'],'Sin barra (solo brindis)':[]};
function insumosCalc(){
  const I=S.insumos,conf=S.invitados.filter(i=>i.nombre&&i.rsvp==='Confirmado');
  const noB=Math.min(100,Math.max(0,num(I.noBeben)))/100,m=1+Math.max(0,num(I.margen))/100,h=Math.max(1,num(I.horas)||1);
  let total,adultos,bebedores,estimado=false;
  if(conf.length){const ad=conf.filter(i=>i.edad==='Adulto');total=conf.length;adultos=ad.length;bebedores=ad.reduce((a,i)=>a+(i.alcohol==='No'?0:i.alcohol==='Sí'?1:(1-noB)),0)}
  else{total=num(S.config.invitadosEst)||0;adultos=Math.round(total*0.85);bebedores=adultos*(1-noB);estimado=true}
  const ninos=total-adultos,sinAlc=total-bebedores,cats=BARRAS[I.barra]||BARRAS.Abierta;
  const sumPct=cats.reduce((a,k)=>a+num(I.reparto[k]),0)||1;
  const tragos=cats.length?bebedores*(2+(h-1))*(PERFIL_F[I.perfil]||1):0;
  const items=[],add=(k,nombre,cant,unidad,detalle)=>{if(cant>0)items.push({k,nombre,cant,unidad,detalle})};
  const up=x=>Math.ceil(x-1e-9);
  cats.forEach(k=>{
    const t=tragos*num(I.reparto[k])/sumPct*m;
    if(k==='Cerveza')add(k,'Cerveza',up(up(t)/24),'cajas de 24',`${up(t)} cervezas de 355 ml`);
    else if(k==='Vino')add(k,'Vino',up(t/5),'botellas 750 ml',`${up(t)} copas de 150 ml`);
    else add(k,k,up(t/12),'botellas 750 ml',`${up(t)} tragos de 60 ml`);
  });
  const dest=cats.filter(k=>!['Cerveza','Vino'].includes(k)).reduce((a,k)=>a+tragos*num(I.reparto[k])/sumPct,0)*m;
  add('mezcladores','Refrescos y mezcladores',up(dest*0.12/2),'botellas de 2 L',`${r1(dest*0.12)} L para ${up(dest)} tragos (120 ml c/u)`);
  if(I.brindis)add('brindis','Espumoso para el brindis',up(adultos*m/6),'botellas 750 ml','1 copa por adulto (6 copas por botella)');
  add('refrescos','Bebidas sin alcohol (refrescos y jugos)',up(sinAlc*h*0.8*m),'latas / piezas 355 ml',`${Math.round(sinAlc)} personas sin alcohol × ${h} h × 0.8`);
  add('agua','Agua embotellada',up(total*(I.calor?2:1)*m),'botellas 600 ml',I.calor?'2 por persona (clima caluroso)':'1 por persona');
  const hielo=total*(I.calor?1:0.5)*(I.barra==='Abierta'?1.5:1)*m;
  add('hielo','Hielo',up(hielo/5),'bolsas de 5 kg',`${Math.round(hielo)} kg`);
  add('vasos','Vasos',up(total*2.5*m),'piezas','2.5 por persona (rotación)');
  if(cats.includes('Vino')||I.brindis)add('copas','Copas (vino y brindis)',up(adultos*1.5*m),'piezas','1.5 por adulto');
  add('servilletas','Servilletas de cóctel',up(total*4*m),'piezas','4 por persona');
  if(I.canapes)add('canapes','Canapés / botana de cóctel',up(total*6*Math.max(0.5,num(I.coctel))*m),'piezas',`6 por persona por hora de cóctel (${num(I.coctel)} h)`);
  if(I.pastel)add('pastel','Pastel',up(total*1.05),'porciones','1 porción por persona + 5%');
  if(I.postres)add('postres','Mesa de postres',up(total*3*m),'piezas','3 por persona');
  return{total,adultos,ninos,bebedores,sinAlc,estimado,tragos,items,sumPct,cats};
}
VIEWS.insumos=()=>{
  $('#pageTitle').textContent='Insumos y bar';$('#pageMeta').textContent='Cuánto comprar según tus invitados: bebidas, hielo, agua, vasos y más. Los cálculos son de planeación; ajusta los porcentajes a tu evento.';
  const I=S.insumos,r=insumosCalc(),pct=k=>`<label class="medida">${k}<input type="number" min="0" max="100" data-ins="reparto.${k}" data-id="ins" data-key="r_${k}" value="${num(I.reparto[k])}" ${r.cats.includes(k)?'':'disabled'}> %</label>`;

    <div class="card kpi"><div class="label">Adultos / menores</div><div class="value">${r.adultos} / ${r.ninos}</div><div class="hint">Adolescentes cuentan como menores</div></div>
    <div class="card kpi"><div class="label">Beberán alcohol (est.)</div><div class="value">${Math.round(r.bebedores)}</div><div class="hint">Según el campo Alcohol de cada invitado</div></div>
    <div class="card kpi"><div class="label">Tragos estimados</div><div class="value">${Math.round(r.tragos)}</div><div class="hint">2 en la primera hora y 1 por hora después</div></div></div>
