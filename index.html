      ${num_('horas','Horas de barra',1,12)}<label class="medida">Consumo ${sel('perfil',Object.keys(PERFIL_F))}</label><label class="medida">Barra ${sel('barra',Object.keys(BARRAS))}</label>${chk('calor','Clima caluroso')}${chk('brindis','Brindis con espumoso')}
      ${num_('noBeben','% de adultos que no beben',0,100)}${num_('margen','Margen de seguridad (%)',0,50)}${num_('coctel','Horas de cóctel',0,6)}${chk('canapes','Canapés')}${chk('pastel','Pastel')}${chk('postres','Mesa de postres')}</div>
      <p class="help" style="margin-top:8px">En la tabla de Invitados, la columna <b>Alcohol</b> permite marcar Sí/No a cada persona; si la dejas vacía, se aplica el porcentaje de arriba solo a los adultos.</p>
      <div class="toolbar" style="margin-top:6px;flex-wrap:wrap;gap:14px"><b class="help">Reparto del alcohol</b>${['Cerveza','Vino','Tequila','Whisky','Ron','Vodka'].map(pct).join('')}<span class="help">Suma activa: ${r.sumPct}% (se ajusta a 100%)</span></div></div>
    <div class="card" style="margin-top:14px"><div class="toolbar" style="margin:0 0 8px"><h3 style="margin:0">Lista de compras</h3><span class="spacer"></span><button class="btn" id="pdfInsumos">PDF de la lista</button></div>
      <table class="simple"><thead><tr><th>Concepto</th><th>Cantidad</th><th>Unidad</th><th>Precio por unidad</th><th>Subtotal</th><th>Cálculo</th></tr></thead><tbody>
      ${r.items.map(x=>`<tr><td>${esc(x.nombre)}</td><td class="num"><b>${x.cant}</b></td><td>${esc(x.unidad)}</td><td class="num"><input type="number" min="0" step="any" data-insp="${x.k}" data-id="ins" data-key="p_${x.k}" value="${I.precios[x.k]??''}" style="width:90px" placeholder="$"></td><td class="num">${num(I.precios[x.k])?money(x.cant*num(I.precios[x.k])):''}</td><td class="mut">${esc(x.detalle)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Sin invitados: registra invitados o define "Invitados estimados" en Configuración.</td></tr>'}
      </tbody>${costo?`<tfoot><tr><td colspan="4"><b>Total estimado</b></td><td class="num"><b>${money(costo)}</b></td><td></td></tr></tfoot>`:''}</table>
      <p class="help" style="margin-top:8px">Supuestos: copa de vino 150 ml (5 por botella), trago de destilado 60 ml (12 por botella de 750 ml), cerveza 355 ml en cajas de 24, mezclador 120 ml por trago, espumoso 6 copas por botella. Son reglas comunes de planeación; tu proveedor puede recomendar otras proporciones.</p></div>`;
  view.querySelectorAll('[data-ins],[data-insp]').forEach(el=>el.onchange=()=>{
    if(el.dataset.insp){I.precios[el.dataset.insp]=el.value===''?'':num(el.value)}
    else{const k=el.dataset.ins,v=el.type==='checkbox'?el.checked:el.type==='number'?num(el.value):el.value;if(k.startsWith('reparto.'))I.reparto[k.slice(8)]=v;else I[k]=v}
    save();pendingFocus={id:'ins',key:el.dataset.key};render();
  });
  $('#pdfInsumos').onclick=pdfInsumos;
};
async function pdfInsumos(){
  const I=S.insumos,r=insumosCalc();if(!r.items.length){toast('No hay invitados para calcular');return}
  const d=new PdfDoc();d.nueva();encabezadoPdf(d,'Lista de compras: bebidas e insumos');let y=102;
  d.texto(48,y,`${r.total} invitados (${r.adultos} adultos, ${r.ninos} menores) · ${Math.round(r.bebedores)} beberán alcohol · ${num(I.horas)} h de barra · consumo ${I.perfil.toLowerCase()} · ${I.barra}`,{size:9,gris:0.4,max:d.w-96});y+=22;

/* ==================================================================
   v12: CONFIRMACIONES (RSVP) conectadas a Google Sheets
   - La app solo LEE el Sheet (acción "lista" del Apps Script); nunca escribe en él.
   - URL y clave se guardan solo en este navegador (ccb.rsvpConn), fuera de S y de los respaldos.
   ================================================================== */
function RS(){return S.rsvp||(S.rsvp={lista:[],ultima:'',sitio:'',tel:{},rec:{}})}
let CONN=(()=>{try{return JSON.parse(localStorage.getItem('ccb.rsvpConn'))||{}}catch(e){return {}}})();
function guardarConn(){try{localStorage.setItem('ccb.rsvpConn',JSON.stringify(CONN))}catch(e){}}
const rsvpEstado={cargando:false,error:'',ultima:''};
function fechaLocalISO(s){const d=new Date(s);if(isNaN(d))return today();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fechaHoraCorta(s){const d=new Date(s);if(!s||isNaN(d))return '';return d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})}
function horaCorta(s){const d=new Date(s);if(!s||isNaN(d))return '';return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}
function normalizarLista(arr){
  return (Array.isArray(arr)?arr:[]).map(x=>({nombre:String(x.nombre||'').trim(),pases:Math.max(0,parseInt(x.pases)||0),estado:x.estado==='si'||x.estado==='no'?x.estado:'pendiente',asistiran:Math.max(0,parseInt(x.asistiran)||0),fecha:String(x.fecha||'')})).filter(x=>x.nombre);
}
function guardarLista(nueva){
  const R=RS(),cambio=JSON.stringify(nueva)!==JSON.stringify(R.lista);
  R.lista=nueva;R.ultima=new Date().toISOString();rsvpEstado.ultima=R.ultima;
  if(cambio)save();else{try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
  return cambio;
}
async function rsvpSync(silencioso){
  if(!CONN.url||!CONN.clave){if(!silencioso)toast('Primero configura la conexión');return false}
  if(rsvpEstado.cargando)return false;
  rsvpEstado.cargando=true;const errAntes=rsvpEstado.error;rsvpEstado.error='';
  if(!silencioso&&S.ui.tab==='confirmaciones')render();
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);let cambio=false;
  try{
    const sep=CONN.url.indexOf('?')>=0?'&':'?';
    const r=await fetch(CONN.url+sep+'accion=lista&clave='+encodeURIComponent(CONN.clave),{signal:ctl.signal,redirect:'follow'});
    const txt=await r.text();let j;
    try{j=JSON.parse(txt)}catch(e){throw new Error('formato')}
    if(!j||!j.ok)throw new Error(j&&j.motivo==='clave'?'clave':'respuesta');
    cambio=guardarLista(normalizarLista(j.lista));
  }catch(e){
    const m=String(e&&e.message||'');
    rsvpEstado.error=m==='clave'?'La clave no coincide con la de tu Apps Script.'
      :m==='formato'||m==='respuesta'?'La respuesta no es válida. Revisa que el enlace termine en /exec y que hayas publicado una nueva versión del script.'
      :e&&e.name==='AbortError'?'Google tardó demasiado en responder. Intenta de nuevo.'
      :'No se pudo conectar. Lo más probable es que esta página publicada no tenga permiso de hablar con Google (no es un error de tu script) o que no haya internet. Usa la carga manual de abajo: son 3 clics.';
  }finally{clearTimeout(to);rsvpEstado.cargando=false}
  if(S.ui.tab==='confirmaciones'&&(!silencioso||cambio||errAntes!==rsvpEstado.error))render();
  if(!silencioso&&!rsvpEstado.error)toast(cambio?'Confirmaciones actualizadas':'Sin cambios en el Sheet');
  return !rsvpEstado.error;
}
setInterval(()=>{if(CONN.auto&&CONN.url&&CONN.clave&&S.ui.tab==='confirmaciones'&&!document.hidden)rsvpSync(true)},30000);

/* ---- respaldo: pegar filas copiadas del Sheet (A nombre, B pases, C estado, D asistirán, E fecha) ---- */
function parseFechaSheet(v){
  const t=String(v||'').trim();if(!t)return '';
  const m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){const d=new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));return isNaN(d)?'':d.toISOString()}
  const d=new Date(t);return isNaN(d)?'':d.toISOString();
}
function rsvpDesdeTexto(txt){
  const t0=String(txt||'').trim();
  if(t0[0]==='{'){let j;try{j=JSON.parse(t0)}catch(e){return null}return j&&j.ok?normalizarLista(j.lista):null}
  const rows=parseCSV(txt);if(!rows.length)return null;
  const datos=isNaN(parseInt((rows[0]||[])[1]))?rows.slice(1):rows;
  const lista=datos.map(r=>{
    const e=normTxt(r[2]||'');
    return{nombre:String(r[0]||'').trim(),pases:parseInt(r[1])||0,estado:e===''?'pendiente':/^no/.test(e)?'no':'si',asistiran:parseInt(r[3])||0,fecha:parseFechaSheet(r[4])};
  }).filter(x=>x.nombre);
  return normalizarLista(lista);
}

/* ---- cálculos ---- */
function rsvpStats(L){
  const o={invTot:L.length,pasesAsig:0,siInv:0,siPases:0,siAsig:0,noInv:0,noPases:0,pendInv:0,pendPases:0};
  L.forEach(x=>{o.pasesAsig+=x.pases;
    if(x.estado==='si'){o.siInv++;o.siPases+=x.asistiran;o.siAsig+=x.pases}
    else if(x.estado==='no'){o.noInv++;o.noPases+=x.pases}
    else{o.pendInv++;o.pendPases+=x.pases}});
  o.resp=o.invTot?Math.round((o.siInv+o.noInv)/o.invTot*100):0;
  return o;
}

  L.forEach(x=>{
    const key=normTxt(x.nombre);vistas.add(key);
    const {n,r}=rsvpObjetivo(x),cur=(porKey[key]||[]).slice().sort((a,b)=>(a.rsvpSeq||0)-(b.rsvpSeq||0));
    let keep=cur;
    if(cur.length>n){
      const ord=cur.slice().sort((a,b)=>(a.mesa?1:0)-(b.mesa?1:0)||(b.rsvpSeq||0)-(a.rsvpSeq||0));
      const sobran=ord.slice(0,cur.length-n);
      sobran.forEach(i=>i.mesa?pl.excede.push({x,i}):pl.quitar.push({x,i}));
      keep=cur.filter(i=>!sobran.includes(i));
    }
    keep.forEach(i=>{if(i.rsvp!==r)pl.cambiar.push({x,i,r})});
    if(keep.length<n){
      const usados=new Set(cur.map(i=>i.rsvpSeq));let k=1;
      for(let m=keep.length;m<n;m++){while(usados.has(k))k++;usados.add(k);pl.agregar.push({x,key,seq:k,r})}
    }
  });
  Object.keys(porKey).forEach(k=>{if(!vistas.has(k))pl.huerfanas.push(...porKey[k])});
  return pl;
}
function rsvpFila(x,key,seq,r){
  return{id:nextId(S.invitados,'I'),hogar:x.nombre,nombreInv:x.nombre,nombre:seq===1?x.nombre:`${x.nombre} – acompañante ${seq}`,invitadoDe:'Ambos',grupo:'',edad:'Adulto',alcohol:'',telefono:RS().tel[key]||'',correo:'',invitacionEnviada:true,rsvp:r,fechaRsvp:rsvpFechaRsvp(x,r),menu:menuNuevo(),alergias:'',transporte:false,hospedaje:false,mesa:'',asiento:'',regalo:false,agradecimiento:false,notas:r==='Pendiente'?`${x.pases} ${x.pases===1?'pase asignado':'pases asignados'}`:'',rsvpKey:key,rsvpSeq:seq};
}
function rsvpAplicar(quitarMan){
  let man=0;
  if(quitarMan){const a=S.invitados.length;S.invitados=S.invitados.filter(i=>i.rsvpKey);man=a-S.invitados.length}
  const pl=rsvpPlan();
  pl.quitar.forEach(({i})=>{const ix=S.invitados.indexOf(i);if(ix>=0)S.invitados.splice(ix,1)});
  pl.cambiar.forEach(({x,i,r})=>{i.rsvp=r;i.fechaRsvp=rsvpFechaRsvp(x,r)});
  pl.agregar.forEach(({x,key,seq,r})=>{S.invitados.push(rsvpFila(x,key,seq,r))});
  save();render();
  toast(`Listo: ${pl.agregar.length} agregados${pl.cambiar.length?`, ${pl.cambiar.length} actualizados`:''}${pl.quitar.length?`, ${pl.quitar.length} quitados`:''}${man?`, ${man} de ejemplo quitados`:''}`);
}
function rsvpResumenPlan(pl){
  const p=[];
  if(pl.agregar.length)p.push(`se agregarán ${pl.agregar.length} registros (${new Set(pl.agregar.map(a=>a.key)).size} invitaciones)`);
  if(pl.cambiar.length)p.push(`${pl.cambiar.length} cambiarán de estado (por ejemplo, de Pendiente a Confirmado)`);
  if(pl.quitar.length)p.push(`se quitarán ${pl.quitar.length} que no tienen mesa`);
  if(pl.excede.length)p.push(`${pl.excede.length} ya sentados exceden lo confirmado y NO se tocan`);
  return p;
}

}

/* ==================================================================
   v15: NUBE (compartir con tu pareja o equipo)
   - Guarda/lee una copia completa de los datos en una hoja aparte, a través de tu mismo Apps Script y tu misma clave.
   - Control de versiones: si otra persona guardó antes, no deja sobrescribir sin avisar.
   - Se excluyen la vista (ui) y la imagen de fondo del plano, que son locales de cada navegador.
   ================================================================== */
function hashTxt(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h)}
function hashActual(){try{const o=JSON.parse(datosSnap());if(o.rsvp)o.rsvp.ultima='';return hashTxt(JSON.stringify(o))}catch(e){return ''}}
const nubeEst={cargando:false,error:'',nube:null,conflicto:false,avisada:-1,revisada:false};
async function nubeLlamar(accion,body){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),40000);
  try{
    let r;
    if(body)r=await fetch(CONN.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal,redirect:'follow'});
    else r=await fetch(CONN.url+(CONN.url.indexOf('?')>=0?'&':'?')+'accion='+accion+'&clave='+encodeURIComponent(CONN.clave),{signal:ctl.signal,redirect:'follow'});
    const txt=await r.text();let j;
    try{j=JSON.parse(txt)}catch(e){throw new Error('formato')}
    if(j&&j.ok===undefined&&j.personas===null)throw new Error('viejo');
    return j;
  }finally{clearTimeout(to)}
}
function nubeMsgError(e){
  const m=String(e&&e.message||'');
  return m==='clave'?'La clave no coincide con la de tu Apps Script.'
    :m==='viejo'||m==='formato'?'Tu Apps Script aún no tiene las funciones de la nube, o no publicaste una nueva versión. Pega el código nuevo y publica una nueva versión.'
    :m==='datos'?'La copia de la nube no es válida.'
    :e&&e.name==='AbortError'?'Google tardó demasiado en responder. Intenta de nuevo.'
    :'No se pudo conectar (sin internet, o esta página no tiene permiso de hablar con Google).';
}
async function nubeRevisar(silencioso){
  if(!CONN.url||!CONN.clave||nubeEst.cargando)return;
  try{
    const j=await nubeLlamar('estadoApp');
    if(!j.ok)throw new Error(j.motivo==='clave'?'clave':'respuesta');
    nubeEst.nube={version:j.version,por:j.por,fecha:j.fecha};nubeEst.error='';nubeEst.revisada=true;
    if(silencioso&&j.version>(CONN.base||0)&&nubeEst.avisada!==j.version){nubeEst.avisada=j.version;toast(`Hay una versión más nueva en la nube${j.por?' (guardada por '+j.por+')':''}. Ve a "Nube" para cargarla.`)}
  }catch(e){if(!silencioso)nubeEst.error=nubeMsgError(e)}
  if(S.ui.tab==='nube')render();
}
async function nubeGuardar(forzar){
  if(!CONN.por){toast('Escribe primero tu nombre');return}
  nubeEst.cargando=true;nubeEst.error='';nubeEst.conflicto=false;render();
  const datos=datosSnap(),h=hashActual();
  try{
    const j=await nubeLlamar('guardarApp',{accion:'guardarApp',clave:CONN.clave,base:CONN.base||0,por:CONN.por,datos,forzar:!!forzar});
    if(j.ok){CONN.base=j.version;CONN.hash=h;guardarConn();nubeEst.nube={version:j.version,por:CONN.por,fecha:j.fecha};toast(`Guardado en la nube (versión ${j.version})`)}
    else if(j.motivo==='conflicto'){nubeEst.nube={version:j.version,por:j.por,fecha:j.fecha};nubeEst.conflicto=true}
    else throw new Error(j.motivo==='clave'?'clave':'respuesta');
  }catch(e){nubeEst.error=nubeMsgError(e)}
  nubeEst.cargando=false;if(S.ui.tab==='nube')render();
}
async function nubeCargar(){
  nubeEst.cargando=true;nubeEst.error='';render();
  let j=null,d=null;
  try{
    j=await nubeLlamar('leerApp');
    if(!j.ok)throw new Error(j.motivo==='clave'?'clave':'respuesta');
    if(j.datos){try{d=JSON.parse(j.datos)}catch(e){throw new Error('datos')}if(!d||!d.config||!d.gastos)throw new Error('datos')}
    nubeEst.nube={version:j.version,por:j.por,fecha:j.fecha};
  }catch(e){nubeEst.error=nubeMsgError(e)}
  nubeEst.cargando=false;
  if(!nubeEst.error&&!d)toast('Aún no hay copia en la nube');
  if(S.ui.tab==='nube')render();

function fechaNube(s){const d=new Date(s);return !s||isNaN(d)?'':d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})}
VIEWS.nube=()=>{

    view.innerHTML=`<div class="card"><h3>Conecta tu Apps Script</h3><p class="help" style="margin-top:6px">Es el mismo enlace y la misma clave de tu tablero. Se guardan solo en este navegador.</p>
      <div class="grid g2" style="margin-top:10px"><label class="medida" style="flex-direction:column;align-items:stretch">Enlace de tu Apps Script (termina en /exec)<input type="text" id="nUrl" style="width:100%" placeholder="https://script.google.com/macros/s/…/exec"></label>

      CONN.url=u;CONN.clave=c;guardarConn();render();nubeRevisar(false);
    };
    return;
  }
  if(!nubeEst.revisada&&!nubeEst.cargando&&!nubeEst.error)setTimeout(()=>nubeRevisar(false),0);
  const n=nubeEst.nube,base=CONN.base||0,sucio=hashActual()!==CONN.hash,nueva=!!n&&n.version>base,vacia=!!n&&n.version===0;
  let estado,cls;

      ${nubeEst.conflicto?`<div class="card" style="border-color:var(--coral);margin:10px 0"><b style="color:var(--coral)">No se guardó.</b> ${esc(n&&n.por||'Alguien')} guardó la versión ${n?n.version:''} después de tu última carga. Para no borrar su trabajo: descarga un respaldo tuyo y luego carga la nube.<div class="rotbtns"><button class="btn" id="nRespaldo">Descargar mi respaldo (.json)</button><button class="btn primary" id="nCargar2">Cargar la versión de la nube</button><button class="btn danger" id="nForzar">Guardar de todas formas (sobrescribe)</button></div></div>`:''}
      <label class="medida" style="flex-direction:column;align-items:stretch;max-width:320px;margin-top:10px">Tu nombre (para que se sepa quién guardó)<input type="text" id="nPor" style="width:100%" value="${esc(CONN.por||'')}" placeholder="Luis"></label>
      <div class="rotbtns" style="margin-top:12px"><button class="btn primary" id="nGuardar" ${nubeEst.cargando||nueva||(!sucio&&!vacia)?'disabled':''}>${nubeEst.cargando?'Trabajando…':'Guardar en la nube'}</button><button class="btn" id="nCargar" ${nubeEst.cargando||!n||vacia?'disabled':''}>Cargar de la nube</button><button class="btn ghost" id="nRevisar" ${nubeEst.cargando?'disabled':''}>Revisar ahora</button></div></div>
    <div class="card" style="margin-top:14px"><h3>Cómo usarlo entre dos personas</h3>
      <ol class="help" style="margin:8px 0 0 18px;line-height:1.7"><li>Quien edita pulsa <b>Guardar en la nube</b> al terminar.</li><li>La otra persona abre la app, entra aquí y pulsa <b>Cargar de la nube</b> antes de editar.</li><li>Avísense por WhatsApp quién va a editar, para no editar los dos a la vez. Si pasa, la app no deja guardar al segundo y le explica qué hacer.</li><li>Al abrir la app, si hay una versión más nueva, te lo avisa.</li></ol>
      <p class="help" style="margin-top:10px">No se comparten la imagen de fondo del plano ni las preferencias de vista; cada navegador conserva las suyas. La copia de la nube incluye presupuesto, pagos, invitados y todo lo demás: protégela con una clave fuerte.</p></div>`;
  $('#nPor').onchange=e=>{CONN.por=e.target.value.trim();guardarConn()};
  $('#nGuardar').onclick=()=>{CONN.por=$('#nPor').value.trim();guardarConn();nubeGuardar(false)};
  $('#nCargar').onclick=()=>nubeCargar();

  const f=$('#nForzar');if(f)f.onclick=()=>confirmar('Guardar de todas formas',`Esto reemplaza en la nube la versión de ${n&&n.por||'la otra persona'} por la tuya. Su trabajo posterior a tu última carga se perderá en la nube.`,'Sobrescribir',()=>{CONN.por=$('#nPor').value.trim()||CONN.por;nubeGuardar(true)});

function sentar(id,mesa){
  const i=S.invitados.find(x=>x.id===id); const m=S.mesas.find(x=>x.nombre===mesa); if(!i||!m)return;
  const ocupados=new Set(S.invitados.filter(x=>x.mesa===mesa&&x.id!==id).map(x=>String(x.asiento)));
  let a=1; while(ocupados.has(String(a)))a++;
  i.mesa=mesa; i.asiento=String(a); S.ui.sel={kind:'mesas',id:m.id}; S.ui.multi=[]; save(); render();
  const cm=calcMesa(m); toast(cm.control==='Sobrecupo'?`${i.nombre} → ${mesa} (sobrecupo)`:`${i.nombre} → ${mesa}, asiento ${a}`);
}

  if(f.ctrl)rows=rows.filter(x=>x.__calc.control===f.ctrl);
  rows=filtrar(rows,f.q,['decision','categoria','op1','op2','op3','eleccion','notas','id']);
  const cols=[{key:'id',label:'ID',type:'id'},{key:'incluir',label:'Incluir',type:'check'},{key:'categoria',label:'Categoría',type:'text'},{key:'decision',label:'Decisión',type:'text',w:'wide'},{key:'op1',label:'Opción 1',type:'text',w:'wide'},{key:'op2',label:'Opción 2',type:'text',w:'wide'},{key:'op3',label:'Opción 3',type:'text',w:'wide'},{key:'eleccion',label:'Elección final',type:'select',options:d=>[d.op1,d.op2,d.op3].filter(Boolean),allowEmpty:true},{key:'fechaLimite',label:'Fecha límite',type:'date'},{key:'estado',label:'Estado',type:'select',options:LISTAS.estadoDecision},{key:'responsable',label:'Responsable',type:'select',options:c.responsables,allowEmpty:true},{key:'notas',label:'Notas / criterios',type:'text',w:'wide'},{key:'control',label:'Control',calc:true,type:'pill'}];
  view.innerHTML=`
    <div class="grid g3">
      <div class="card kpi"><div class="label">Decisiones activas</div><div class="value">${r.decActivas}</div></div>
      <div class="card kpi ok"><div class="label">Resueltas</div><div class="value">${r.decResueltas}</div><div class="bar" style="margin-top:10px"><i style="width:${r.decActivas?r.decResueltas/r.decActivas*100:0}%"></i></div></div>
      <div class="card kpi ${r.decVencidas?'alert':''}"><div class="label">Vencidas</div><div class="value">${r.decVencidas}</div></div>
    </div>
    <div style="margin:18px 0 12px" class="legendkey"><span><i class="e"></i>Editable</span><span><i class="a"></i>Automático</span></div>
    <div data-list="decisiones">${toolbar('decisiones',`<select data-filter="ctrl"><option value="">Todo</option>${['Vencida','Abierta','Decidida','Descartada','Falta elección final'].map(x=>`<option ${f.ctrl===x?'selected':''}>${x}</option>`).join('')}</select>`)}${tableHTML(rows,cols,{del:true})}</div>`;
  bindToolbar('decisiones',()=>{S.decisiones.push({id:nextId(S.decisiones,'D'),incluir:true,categoria:'',decision:'',op1:'',op2:'',op3:'',eleccion:'',fechaLimite:'',estado:'Pendiente',responsable:'Ambos',notas:''});save();pendingFocus={id:S.decisiones[S.decisiones.length-1].id,key:'decision'};render();});
};

/* ==================================================================
   RENDER, TEMA, RESPALDOS
   ================================================================== */
function render(){
  renderNav();
  (VIEWS[S.ui.tab]||VIEWS.dashboard)();
  restoreFocus();
}
$('#btnMenu').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('click',e=>{if(window.innerWidth<=900&&!e.target.closest('#side')&&!e.target.closest('#btnMenu'))$('#side').classList.remove('open')});
$('#btnTheme').onclick=()=>{
  const cur=document.documentElement.dataset.theme; const sysDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = cur==='dark' || (!cur&&sysDark);
  document.documentElement.dataset.theme = isDark?'light':'dark';
  try{localStorage.setItem('ccb.theme',document.documentElement.dataset.theme)}catch(e){}
};
try{const t=localStorage.getItem('ccb.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#btnExport').onclick=async()=>{
  const json=JSON.stringify(S,null,2); const name=`respaldo-${(S.config.evento||'evento').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${today()}.json`;
  let dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use('downloads') }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:json}); S.ui.ultimoRespaldo=today(); save(); toast('Respaldo guardado') }catch(e){ if(e&&e.code!=='declined') toast('No se pudo guardar el archivo') } }
  else { try{ await navigator.clipboard.writeText(json); toast('Descarga no disponible aquí: respaldo copiado al portapapeles') }catch(e){ toast('Descarga no disponible en esta vista') } }
};
$('#btnImport').onclick=()=>$('#fileImport').click();
$('#fileImport').onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!d.config||!d.gastos)throw 0; confirmar('Importar respaldo',`Se reemplazarán los datos actuales por los de "${file.name}".`,'Importar',()=>{S=migrar(d);save();render();toast('Respaldo importado')}) }catch(err){ toast('El archivo no es un respaldo válido') } e.target.value=''; };
  rd.readAsText(file);
};
$('#btnReset').onclick=()=>{
  $('#modalTitle').textContent='Reiniciar datos'; $('#modalBody').textContent='Elige con qué quieres empezar. Los datos actuales se perderán (exporta un respaldo antes si los necesitas).';
  const a=$('#modalActions'); a.innerHTML='';
  const mk=(l,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=l;b.onclick=()=>{$('#modalBg').classList.remove('open');fn&&fn()};return b};
  a.append(mk('Cancelar','',null), mk('Plantilla vacía','',()=>{S=plantillaVacia();save();render();toast('Plantilla vacía lista')}), mk('Datos de ejemplo','primary',()=>{S=datosDemo();save();render();toast('Datos de ejemplo cargados')}));
  $('#modalBg').classList.add('open');
};
$('#modalBg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalBg').classList.remove('open')});
render();
</script>
</body>
</html>
